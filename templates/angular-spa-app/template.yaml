apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: angular-spa-app
  title: Angular SPA (Adhar UI)
  description: >-
    An Angular single-page app pre-wired with the Adhar UI design system
    (@adhar-ui/angular + Tailwind v4 preset + tokens). Built with the Angular CLI,
    served by nginx via buildpacks, and shipped through Adhar's secure supply
    chain — trivy scan + cosign sign, kyverno verification, GitOps deploy with
    Argo Rollouts.
  tags:
    - recommended
    - angular
    - frontend
    - adhar-ui
    - supply-chain
spec:
  owner: group:platform-engineers
  type: website

  parameters:
    - title: Application
      required: [name]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the app (lowercase, DNS-friendly)
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Runtime
      properties:
        replicas:
          title: Replicas
          type: integer
          default: 1
          minimum: 1
          maximum: 5

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - adhar.localtest.me:8443

  steps:
    - id: verify
      name: Verify platform dependencies
      action: cnoe:verify:dependency
      input:
        verifiers:
          - kind: CustomResourceDefinition
            group: kpack.io
            version: v1alpha2
            plural: clusterbuilders

    - id: template
      name: Generate the app
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          replicas: ${{ parameters.replicas }}
          port: 8080
          hostname: ${{ parameters.name }}.adhar.localtest.me
          gitOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD deployment
      action: cnoe:create-argocd-app
      input:
        appName: ${{ parameters.name }}
        appNamespace: adhar-system
        argoInstance: local
        projectName: default
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: "deploy"

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
