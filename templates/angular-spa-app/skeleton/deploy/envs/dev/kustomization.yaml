# dev: the first environment every build lands in; Kargo promotes it onward once Prometheus says it is healthy.
# The namespace is the project's dev environment (Project.status.environments).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
images:
  - name: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}
    newTag: latest
patches:
  - target: {kind: Rollout, name: "${{ values.name }}"}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # The environment's name, for telemetry (deploy/base/rollout.yaml). The
  # `test` op fails the build if the base's env order ever moves it.
  - target: {kind: Rollout, name: "${{ values.name }}"}
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: APP_ENVIRONMENT
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value: {name: APP_ENVIRONMENT, value: dev}
  - target: {kind: HTTPRoute, name: "${{ values.name }}"}
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ${{ values.devHostnamesJson }}
