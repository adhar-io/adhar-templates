# Server-side additions to the nginx the buildpack runs (project.toml sets
# BP_WEB_SERVER_INCLUDE_FILE_PATH to this file, which lands inside the server
# block it generates). The buildpack renders the Go template expressions in
# double braces below when the container STARTS, so they read the Pod's
# environment (deploy/base/rollout.yaml). Never write double braces in a comment
# here: they are rendered too, and a template error stops nginx from starting.

# /runtime-config.json — what the browser turns on (src/telemetry.js). The same
# image runs in every environment, so this is answered from the environment
# rather than built into the bundle. Every value is optional; an empty one
# switches that piece off.
#
#   APP_ENVIRONMENT  the environment's name (dev, test, prod), set per overlay
#   FARO_URL         the platform's Faro receiver, for real-user monitoring
{%- if values.withAnalytics %}
#   POSTHOG_KEY      the PostHog project key for this environment (phc_..., a
#                    public key by design) from the optional Secret <app>-posthog
#   POSTHOG_HOST     where /ingest forwards to (the PostHog capture service)
#   POSTHOG_UI_HOST  optional; PostHog's own UI, for links from the toolbar
#   POSTHOG_SESSION_REPLAY  "true" to record sessions; off unless set
{%- endif %}
location = /runtime-config.json {
  default_type application/json;
  add_header Cache-Control "no-store" always;
{%- if values.withAnalytics %}
{{- if and (env "POSTHOG_KEY") (env "POSTHOG_HOST") }}
  return 200 '{"environment":"{{ env "APP_ENVIRONMENT" }}","faro":{"url":"{{ env "FARO_URL" }}"},"posthog":{"key":"{{ env "POSTHOG_KEY" }}","apiHost":"/ingest","uiHost":"{{ env "POSTHOG_UI_HOST" }}","replay":"{{ env "POSTHOG_SESSION_REPLAY" }}"}}';
{{- else }}
  return 200 '{"environment":"{{ env "APP_ENVIRONMENT" }}","faro":{"url":"{{ env "FARO_URL" }}"},"posthog":null}';
{{- end }}
}

# /ingest/ — PostHog, same-origin. posthog-js sends events, flags and its lazily
# loaded scripts here and nginx forwards them to POSTHOG_HOST with the /ingest
# prefix removed. Same-origin means no CORS and no third-party request for an
# ad blocker to drop. No cookie and no client address is forwarded: PostHog
# sees this Pod as the sender, so it stores no visitor IP. Without a configured
# key the path answers 404 and nothing is proxied.
location ^~ /ingest/ {
{{- if and (env "POSTHOG_KEY") (env "POSTHOG_HOST") }}
  # A variable in proxy_pass resolves PostHog per request instead of once at
  # startup, so a PostHog that is not up yet never stops the app from starting.
  resolver {{ or (env "NGINX_RESOLVER") "kube-dns.kube-system.svc.cluster.local" }} valid=30s ipv6=off;
  resolver_timeout 2s;
  set $posthog_upstream "{{ env "POSTHOG_HOST" }}";
  rewrite ^/ingest/(.*)$ /$1 break;
  proxy_pass $posthog_upstream;
  proxy_set_header Host $proxy_host;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Real-IP "";
  proxy_hide_header Set-Cookie;
  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  client_max_body_size 20m;
{{- else }}
  return 404;
{{- end }}
}
{%- else %}
  return 200 '{"environment":"{{ env "APP_ENVIRONMENT" }}","faro":{"url":"{{ env "FARO_URL" }}"}}';
}
{%- endif %}
{%- if values.withLocalisation %}

# /i18n/<language>.json — the app's translations, served same-origin.
#
# The nginx buildpack includes this file inside the server block it generates
# (BP_WEB_SERVER_INCLUDE_FILE_PATH in project.toml) and renders the Go template
# expressions in double braces below when the container STARTS, so it reads the
# Pod's environment (never write double braces in a comment here: they are
# rendered too, and a template error stops nginx from starting):
#
#   TOLGEE_API_URL     Tolgee's base URL, a fully qualified name, no trailing
#                      slash (http://tolgee.adhar-system.svc.cluster.local:8080)
#   TOLGEE_PROJECT_ID  the project's numeric id
#   TOLGEE_API_KEY     a READ-ONLY project API key. It is added here, on the
#                      server; the browser never sees it.
#   NGINX_RESOLVER     optional; the DNS server nginx resolves Tolgee with
#                      (default: the cluster's kube-dns)
#
# All three come from the Secret <app>-tolgee (deploy/base/rollout.yaml) and are
# optional. With all three set, the request is proxied to Tolgee's export API
# (one language, flat JSON keys). Without them — or when Tolgee errors, times
# out or cannot be resolved — nginx answers with the copy built into the image
# (i18n/<language>.json in the build output, copied from src/i18n/ by
# angular.json), so the app always has its texts. A language that is neither
# in Tolgee nor built in answers 404, and the app falls back to English.
location ^~ /i18n/ {
  location ~ "^/i18n/(?<i18n_lang>[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*)\.json$" {
    # One minute in the browser and any shared cache in front: Tolgee sees at
    # most one export per client per language per minute, and a fixed text is
    # live within a minute.
    add_header Cache-Control "public, max-age=60" always;
{{- if and (env "TOLGEE_API_URL") (env "TOLGEE_PROJECT_ID") (env "TOLGEE_API_KEY") }}
    # A variable in proxy_pass resolves Tolgee per request instead of once at
    # startup, so a missing or not-yet-created Tolgee Service never stops the
    # app from starting.
    resolver {{ or (env "NGINX_RESOLVER") "kube-dns.kube-system.svc.cluster.local" }} valid=30s ipv6=off;
    resolver_timeout 2s;
    set $tolgee_export "{{ env "TOLGEE_API_URL" }}/v2/projects/{{ env "TOLGEE_PROJECT_ID" }}/export";
    proxy_pass $tolgee_export?languages=$i18n_lang&format=JSON&zip=false&structureDelimiter=;
    # Nothing from the browser — cookies, authorization — is forwarded.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header X-API-Key "{{ env "TOLGEE_API_KEY" }}";
    proxy_set_header Accept "application/json";
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    # Any error from Tolgee (wrong key, unknown project, unknown language,
    # outage) and any failure to reach it fall back to the built-in copy.
    add_header X-Translations-Source "tolgee" always;
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 429 500 502 503 504 = @i18n_bundled;
{{- else }}
    add_header X-Translations-Source "bundled" always;
    try_files /i18n/$i18n_lang.json =404;
{{- end }}
  }
  return 404;
}

location @i18n_bundled {
  add_header Cache-Control "public, max-age=60" always;
  add_header X-Translations-Source "bundled" always;
  try_files /i18n/$i18n_lang.json =404;
}
{%- endif %}
