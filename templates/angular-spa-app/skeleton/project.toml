# Cloud Native Buildpacks build config. The Node.js buildpack runs `ng build`
# (Angular application builder → dist/<name>/browser), then the web-servers
# buildpack serves it with nginx. PUSH_STATE serves index.html for SPA routes.
[[build.env]]
name = "BP_NODE_RUN_SCRIPTS"
value = "build"

[[build.env]]
name = "BP_WEB_SERVER"
value = "nginx"

[[build.env]]
name = "BP_WEB_SERVER_ROOT"
value = "dist/${{ values.name }}/browser"

[[build.env]]
name = "BP_WEB_SERVER_ENABLE_PUSH_STATE"
value = "true"
{%- if values.withLocalisation %}

# /i18n/<language>.json: proxied to Tolgee at runtime, with the translations
# built into the output's i18n/ folder as the fallback. The buildpack includes
# this file in the server block of the nginx.conf it generates and renders its
# env templates at container start.
[[build.env]]
name = "BP_WEB_SERVER_INCLUDE_FILE_PATH"
value = "nginx-i18n.conf"
{%- endif %}
