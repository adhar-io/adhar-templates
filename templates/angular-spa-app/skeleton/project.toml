# Cloud Native Buildpacks build config. The Node.js buildpack runs `ng build`
# (Angular application builder → dist/<name>/browser), then the web-servers
# buildpack serves it with nginx. PUSH_STATE serves index.html for SPA routes.
[[build.env]]
name = "BP_NODE_RUN_SCRIPTS"
value = "build"

[[build.env]]
name = "BP_WEB_SERVER"
value = "nginx"

[[build.env]]
name = "BP_WEB_SERVER_ROOT"
value = "dist/${{ values.name }}/browser"

[[build.env]]
name = "BP_WEB_SERVER_ENABLE_PUSH_STATE"
value = "true"

# nginx-app.conf is included in the server block of the nginx.conf the
# buildpack generates and rendered from the Pod's environment at container
# start. It serves /runtime-config.json (what the browser's telemetry turns on){% if values.withAnalytics %},
# /ingest/ (PostHog, same-origin){% endif %}{% if values.withLocalisation %} and /i18n/<language>.json (Tolgee, with the
# translations built into the output's i18n/ folder as the fallback){% endif %}.
[[build.env]]
name = "BP_WEB_SERVER_INCLUDE_FILE_PATH"
value = "nginx-app.conf"
