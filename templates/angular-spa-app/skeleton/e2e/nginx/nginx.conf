# The nginx.conf the nginx buildpack generates for this app (BP_WEB_SERVER=nginx,
# BP_WEB_SERVER_ENABLE_PUSH_STATE=true, BP_WEB_SERVER_INCLUDE_FILE_PATH), cut
# down to what /i18n depends on, for e2e/nginx/test.sh. The real template is
# https://github.com/paketo-buildpacks/nginx/blob/main/assets/default.conf.
worker_processes 1;
daemon off;
error_log stderr;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  port_in_redirect off;
  server_tokens off;

  server {
    listen 8080 default_server;
    server_name _;
    root /workspace/WEB_ROOT;

    location / {
      if (!-e $request_filename) {
        rewrite ^(.*)$ / break;
      }
      index index.html index.htm Default.htm;
    }

    location ~ /\.(?!well-known) {
      deny all;
      return 404;
    }
    include nginx-i18n.conf;
  }
}
