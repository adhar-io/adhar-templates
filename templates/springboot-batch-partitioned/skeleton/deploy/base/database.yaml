# The job's own PostgreSQL, provisioned by the Adhar control plane (Crossplane)
# as a CloudNativePG cluster with WAL archiving to the platform object store and
# a daily base backup (ADR-0021) — the same request a Database self-service
# makes. It is not optional: it holds
#   public   the business tables (src/main/resources/db/migration, Flyway)
#   batch    Spring Batch's JobRepository and the partition channel
#            (INT_CHANNEL_MESSAGE), both migrated by adhar-kit-batch at startup
# A partitioned run needs no broker: the manager writes one request per
# partition into the channel, each worker claims one with a single
# DELETE … RETURNING, and the JobRepository guarantees every partition runs once.
#
# CNPG publishes the connection Secret `${{ values.name }}-db-app` (jdbc-uri,
# username, password). batchjob.yaml names it as `database.secretRef`, and every
# pod of a run reads it as SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD. The
# first run waits in CreateContainerConfigError until the Secret exists, which
# is the intended order: the job never starts against a database that is not
# there yet.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: ${{ values.name }}-db
  labels:
    app: ${{ values.name }}
    app.kubernetes.io/name: ${{ values.name }}-db
    adhar.io/application: ${{ values.name }}
    platform.adhar.io/self-service: "true"
spec:
  crossplane:
    compositionRef:
      name: database-local-cnpg
  parameters:
    engine: postgresql
    # The local composition lets the CNPG operator pick its own image; this
    # version is what a cloud composition would provision.
    engineVersion: "16"
    storageSize: 2Gi
    # A partitioned run opens a connection pool per pod (the manager and every
    # worker poll the JobRepository), so this is sized for a few pods. Raise it
    # with the data and the worker count, and remember a memory limit below what
    # Postgres uses is an OOM kill.
    resources:
      cpu: 100m
      memory: 256Mi
      memoryLimit: 512Mi
    backupRetentionDays: 7
