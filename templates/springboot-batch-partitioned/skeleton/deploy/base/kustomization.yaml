# The job as one unit; deploy/envs/<env> places it in an environment.
# Argo CD syncs each overlay (`deploy/envs/<env>`) into the project's namespace
# for that environment; Kargo promotes the image digest from dev to test to
# prod by editing ONLY the overlay's `images:` block (ADR-0026).
#
# What is NOT here, on purpose: the CronJob (or Volcano CronJob), the run
# template, the runner's ServiceAccount/Role/RoleBinding and the alert rules are
# COMPOSED by the platform from batchjob.yaml (compositions/batchjob/kubernetes.yaml),
# and so is the gang a partitioned run is scheduled as. A CronJob or Volcano Job
# written here would be a second copy the platform never sees — no run template
# for the Console or `adhar batch run`, no queue, no run-integrity policy, no
# alerts keyed on the run's labels.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - batchjob.yaml
  - database.yaml
# Without this, an overlay's `images:` entry — the one Kargo edits — would
# silently leave `:latest` in place: kustomize knows where a CronJob keeps its
# image, not where a BatchJob does.
configurations:
  - kustomizeconfig.yaml
