spring.application.name=${{ values.name }}

# A run is a process: every pod of it starts, plays its part and exits with the kit's exit code.
# adhar-kit-batch's runner reads the run contract the platform sets on every pod
# (ADHAR_BATCH_JOB, _ROLE, _PARAMS, _PARTITION_* - see deploy/base/batchjob.yaml) and switches
# Spring Boot's own job launcher and web server off itself: there is no server and no endpoint.
# A plain `mvn spring-boot:run` is one run of the job for today, manager and partitions in this
# one process (Application.main).

# Rows per chunk: one transaction holds a chunk's reads, its upserts and the partition's progress.
adhar.batch.chunk.size=${{ values.chunkSize or 500 }}
# Records the processor may refuse per partition (skipped and dead-lettered) before the partition
# fails, not retryable.
batch.skip-limit=10

# Partitions per run. On the platform ADHAR_BATCH_PARTITION_GRIDSIZE (the BatchJob's gridSize)
# overrides this; it is what a local run and the tests split into.
adhar.batch.partition.grid-size=${{ values.gridSize or 8 }}

# Metrics are PUSHED to the platform's collector, not scraped: a run shorter than a scrape
# interval would never be seen. The composition sets OTEL_EXPORTER_OTLP_ENDPOINT on every pod
# (the development container too); on a laptop without it the one push at exit is refused and
# logged, and nothing else happens.
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=30s

# The job's own PostgreSQL (deploy/base/database.yaml). Schema "batch" holds Spring Batch's
# JobRepository and the partition channel, migrated by adhar-kit-batch itself (prefix BATCH_), so
# do not set spring.batch.jdbc.initialize-schema or spring.batch.jdbc.table-prefix here. Schema
# "public" holds the business tables, migrated by Flyway from db/migration. The platform injects
# the three variables from the database's connection Secret; the defaults are compose.yaml's
# Postgres on a laptop.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.schemas=public
# A team often loads batch_input before the job's first run, and Flyway refuses a non-empty schema
# with no history of its own: baseline it BELOW V1, so V1 still runs (its CREATE TABLE IF NOT EXISTS
# keeps a table that is already there).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# No endpoints, so nothing to protect: the Adhar Kit starter's HTTP security stays off.
adhar.security.enabled=false
