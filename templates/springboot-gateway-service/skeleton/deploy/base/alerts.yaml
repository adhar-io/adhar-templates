# The service's own alerts, evaluated by the platform's Prometheus in every
# environment the overlay places it in (kube-prometheus selects every
# PrometheusRule on the cluster). Severity follows the tier chosen at creation.
# Surfaced on the catalog card through the adhar.io/alerts annotation.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
    adhar.io/application: ${{ values.name }}
spec:
  groups:
    - name: ${{ values.name }}.availability
      rules:
        - alert: ApplicationPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{pod=~"${{ values.name }}-[a-z0-9]+-[a-z0-9]+",container!="POD"}[15m]) > 2
          for: 5m
          labels:
            severity: ${{ values.tier or 'standard' }}
            application: ${{ values.name }}
          annotations:
            summary: ${{ values.name }} is restarting
            description: A ${{ values.name }} container restarted more than twice in fifteen minutes.
{%- if values.runbookUrl %}
            runbook_url: "${{ values.runbookUrl }}"
{%- endif %}
        - alert: ApplicationPodsUnavailable
          expr: sum(kube_pod_status_ready{pod=~"${{ values.name }}-[a-z0-9]+-[a-z0-9]+",condition="true"}) < 1
          for: 5m
          labels:
            severity: ${{ values.tier or 'standard' }}
            application: ${{ values.name }}
          annotations:
            summary: ${{ values.name }} has no ready pod
            description: No ${{ values.name }} pod has been Ready for five minutes; the service is down in this environment.
{%- if values.runbookUrl %}
            runbook_url: "${{ values.runbookUrl }}"
{%- endif %}
        - alert: ApplicationHighErrorRate
          expr: sum(rate(http_server_requests_seconds_count{pod=~"${{ values.name }}-[a-z0-9]+-[a-z0-9]+",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{pod=~"${{ values.name }}-[a-z0-9]+-[a-z0-9]+"}[5m])), 1e-9) > 0.05
          for: 10m
          labels:
            severity: ${{ values.tier or 'standard' }}
            application: ${{ values.name }}
          annotations:
            summary: ${{ values.name }} is serving errors
            description: More than 5% of ${{ values.name }} requests answered 5xx for ten minutes (SLO ${{ values.sloTarget or '99.9' }}%).
{%- if values.runbookUrl %}
            runbook_url: "${{ values.runbookUrl }}"
{%- endif %}
    - name: ${{ values.name }}.gateway
      rules:
        # A route's circuit breaker has been open for two minutes: the upstream
        # behind it is failing and callers are getting the fallback.
        - alert: GatewayCircuitBreakerOpen
          expr: max by (name) (resilience4j_circuitbreaker_state{pod=~"${{ values.name }}-[a-z0-9]+-[a-z0-9]+",state="open"}) == 1
          for: 2m
          labels:
            severity: ${{ values.tier or 'standard' }}
            application: ${{ values.name }}
          annotations:
            summary: ${{ values.name }} circuit breaker {{ $labels.name }} is open
            description: The gateway has stopped calling the upstream behind route {{ $labels.name }} because it kept failing; callers get 503 until it recovers. Look at that upstream, not the gateway.
{%- if values.runbookUrl %}
            runbook_url: "${{ values.runbookUrl }}"
{%- endif %}
        # Replicas are refusing requests at gateway.max-in-flight. Brief bursts
        # are what shedding is for; sustained shedding means too few replicas.
        - alert: GatewaySheddingLoad
          expr: sum(rate(gateway_requests_shed_total{pod=~"${{ values.name }}-[a-z0-9]+-[a-z0-9]+"}[5m])) > 1
          for: 10m
          labels:
            severity: ${{ values.tier or 'standard' }}
            application: ${{ values.name }}
          annotations:
            summary: ${{ values.name }} is shedding load
            description: The gateway has refused requests with 503 for ten minutes because replicas were at their in-flight limit. Raise the autoscaler's maximum or gateway.max-in-flight.
{%- if values.runbookUrl %}
            runbook_url: "${{ values.runbookUrl }}"
{%- endif %}
        # Upstream connection pool exhausted: requests wait for a connection.
        - alert: GatewayConnectionPoolSaturated
          expr: max by (remote_address) (reactor_netty_connection_provider_pending_connections{pod=~"${{ values.name }}-[a-z0-9]+-[a-z0-9]+"}) > 50
          for: 5m
          labels:
            severity: ${{ values.tier or 'standard' }}
            application: ${{ values.name }}
          annotations:
            summary: ${{ values.name }} is waiting for upstream connections to {{ $labels.remote_address }}
            description: Requests are queueing for a connection to {{ $labels.remote_address }}; the pool's max-connections is reached. Either the upstream is slow (look at it first) or the pool is too small for the load.
{%- if values.runbookUrl %}
            runbook_url: "${{ values.runbookUrl }}"
{%- endif %}
