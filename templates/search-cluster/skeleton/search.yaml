# OpenSearch cluster request — the Adhar control plane (Crossplane) composes an
# OpenSearchCluster from this, run by the platform's OpenSearch operator.
apiVersion: platform.adhar.io/v1alpha1
kind: Search
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    platform.adhar.io/self-service: "true"
spec:
  parameters:
    organisation: ${{ values.organisation }}
    team: ${{ values.team }}
    project: "${{ values.project }}"
    environment: ${{ values.environment }}
    nodes: ${{ values.nodes }}
    storageSize: ${{ values.storageSize }}
    dashboards:
      enabled: ${{ values.dashboards }}
    snapshots:
      enabled: ${{ values.snapshots }}
