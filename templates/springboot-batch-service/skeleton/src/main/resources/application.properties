spring.application.name=${{ values.name }}

# A run is a process: it starts, runs ONE job once and exits with the kit's exit code.
# PlatformRunLauncher launches it from the run contract the platform sets on every run pod
# (ADHAR_BATCH_JOB, _PARAMS, _TRIGGER, ... - see deploy/base/batchjob.yaml); never Spring Boot
# at startup, and never a web request: there is no server and no endpoint. A plain
# `mvn spring-boot:run` is one run of the sample job for today (Application.main).
spring.batch.job.enabled=false
spring.main.web-application-type=none
# A run pod needs no service discovery, and adhar-kit-kubernetes starting it as the runner's
# ServiceAccount - which may only read its own Job and pod - would fail the context.
spring.main.cloud-platform=none

# Metrics are PUSHED to the platform's collector, not scraped: a run shorter than a scrape
# interval would never be seen. The composition sets OTEL_EXPORTER_OTLP_ENDPOINT on every run
# (the development container too); on a laptop without it the one push at exit is refused and
# logged, and nothing else happens.
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=30s

# Where the sample job reads from when a run names no `source`: file (classpath), database (the
# table below) or list (batch.items). Keep batch.input-type equal to the parameter's default in
# deploy/base/batchjob.yaml - it is part of a run's identity.
batch.input-type=file
batch.file-path=data/input.txt
batch.table=batch_input
batch.key-column=id
batch.payload-column=payload
batch.chunk-size=50
batch.partition-count=4
batch.retry-limit=3
batch.backoff-ms=2000

# The job's own PostgreSQL (deploy/base/database.yaml): Spring Batch's JobRepository in schema
# "batch" - adhar-kit-batch migrates it itself (prefix BATCH_), so do not set
# spring.batch.jdbc.initialize-schema or spring.batch.jdbc.table-prefix here - beside the
# business tables in "public". The platform injects the three variables from the database's
# connection Secret; the defaults are compose.yaml's Postgres on a laptop.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver

{% if values.withKafka %}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
{%- endif %}

# No endpoints, so nothing to protect: the Adhar Kit starter's HTTP security stays off.
adhar.security.enabled=false
