server.port=${PORT:8080}

# The job is launched by the CronJob (`--run-batch`) or by POST /api/jobs/{job}/run,
# never by Spring Boot at every startup.
spring.batch.job.enabled=false

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true

# Where the sample job reads from: file (classpath), database (the table below) or list
# (batch.items). A run can override it with the `source` job parameter.
batch.input-type=file
batch.file-path=data/input.txt
batch.table=batch_input
batch.key-column=id
batch.payload-column=payload
batch.chunk-size=50
batch.partition-count=4
batch.retry-limit=3
batch.backoff-ms=2000
batch.sla-seconds=900

{% if values.withDatabase %}
# Spring Batch metadata lives in the service's PostgreSQL database: adhar-kit-batch migrates
# the JobRepository schema itself (schema "batch", prefix BATCH_), so do not set
# spring.batch.jdbc.initialize-schema or spring.batch.jdbc.table-prefix here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver
{%- else %}
# No metadata database was chosen: the JobRepository is an embedded in-memory H2 database that
# Spring Boot initialises with Spring Batch's own schema. Runs do not survive the pod, so a
# restart cannot resume an interrupted run - choose the PostgreSQL option for that.
spring.datasource.url=jdbc:h2:mem:batch;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
{%- endif %}

{% if values.withKafka %}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
{%- endif %}

# Security is controlled by the Adhar Kit starter. Leave it open or protect it
# via a Keycloak JWT depending on the scaffolded template options.
{% if values.withAuth %}
adhar.security.enabled=true
{%- else %}
adhar.security.enabled=false
{%- endif %}
