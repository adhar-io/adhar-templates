apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
  - resilience.yaml
  - rbac.yaml
  - service.yaml
  - podmonitor.yaml
{%- if values.enableAlerts %}
  - alerts.yaml
{%- endif %}
{%- if values.enablePdb %}
  - pdb.yaml
{%- endif %}
{%- if values.enableHpa %}
  - hpa.yaml
{%- endif %}
