apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  scaleTargetRef:
    apiVersion: batch/v1
    kind: CronJob
    name: ${{ values.name }}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
