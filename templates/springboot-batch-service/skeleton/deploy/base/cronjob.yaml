apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  schedule: "${{ values.schedule }}"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: ${{ values.name }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: ${{ values.name }}
          imagePullSecrets:
            - name: harbor-dockercfg
          containers:
            - name: app
              image: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}:latest
              env:
                - name: PORT
                  value: "8080"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: OTEL_SERVICE_NAME
                  value: "${{ values.name }}"
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.adhar-system.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: "service.namespace=adhar"
                - name: OTEL_TRACES_EXPORTER
                  value: "otlp"
                - name: OTEL_METRICS_EXPORTER
                  value: "otlp"
                - name: OTEL_LOGS_EXPORTER
                  value: "otlp"
{%- if values.withDatabase %}
                - name: SPRING_DATASOURCE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ${{ values.name }}-db-app
                      key: jdbc-uri
                - name: SPRING_DATASOURCE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${{ values.name }}-db-app
                      key: username
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${{ values.name }}-db-app
                      key: password
{%- endif %}
{%- if values.withKafka %}
                - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
                  value: "${{ values.name }}-events-kafka-bootstrap:9092"
{%- endif %}
              ports:
                - containerPort: 8080
                  name: http
              readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: 8080
                initialDelaySeconds: 15
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: 8080
                initialDelaySeconds: 20
                periodSeconds: 10
