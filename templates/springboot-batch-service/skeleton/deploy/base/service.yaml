apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  annotations:
    adhar.io/slo-availability: "${{ values.sloTarget or '99.9' }}"
    adhar.io/slo-latency-p95-ms: "${{ values.latencyTargetMs or '500' }}"
{%- if values.perfPath %}
    adhar.io/perf-path: "${{ values.perfPath }}"
{%- endif %}
{%- if values.chaosTesting == false %}
    adhar.io/chaos: "false"
{%- else %}
    adhar.io/chaos-experiments: "${{ values.chaosExperiments or 'pod-delete,pod-network-latency,pod-cpu-hog' }}"
{%- endif %}
  labels:
    app: ${{ values.name }}
spec:
  selector:
    app: ${{ values.name }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
