# prod: promoted only by a Release (manual approval), and only with a build
# verified in test. The schedule runs as written, and the runs carry the
# adhar-batch-critical PriorityClass — accepted in prod only, and it never
# preempts anything: it decides who waits when the cluster is full.
# The namespace is the project's prod environment (Project.status.environments).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
images:
  - name: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}
    newTag: latest
patches:
  - target: {group: platform.adhar.io, kind: BatchJob, name: "${{ values.name }}"}
    patch: |-
      - op: add
        path: /spec/parameters/priority
        value: critical
      # Where it runs, stated on the BatchJob too. The namespace's labels decide
      # (the composition reports a disagreement on its Placement condition), so
      # this only keeps the object honest when read on its own.
      - op: add
        path: /spec/parameters/environment
        value: prod
  - target: {group: platform.adhar.io, kind: Database, name: "${{ values.name }}-db"}
    patch: |-
      - op: add
        path: /spec/parameters/environment
        value: prod
