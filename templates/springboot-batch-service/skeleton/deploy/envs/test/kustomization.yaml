# test: promoted automatically once dev is verified. The schedule runs here as
# written in deploy/base/batchjob.yaml — test is where a build proves it can run
# unattended before a Release takes it to prod.
# The namespace is the project's test environment (Project.status.environments).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test
resources:
  - ../../base
images:
  - name: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}
    newTag: latest
patches:
  # Where it runs, stated on the BatchJob too. The namespace's labels decide
  # (the composition reports a disagreement on its Placement condition), so
  # this only keeps the object honest when read on its own.
  - target: {group: platform.adhar.io, kind: BatchJob, name: "${{ values.name }}"}
    patch: |-
      - op: add
        path: /spec/parameters/environment
        value: test
  - target: {group: platform.adhar.io, kind: Database, name: "${{ values.name }}-db"}
    patch: |-
      - op: add
        path: /spec/parameters/environment
        value: test
