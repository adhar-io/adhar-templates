apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: springboot-batch-service
  labels:
    # The per-application Grafana dashboard template this kind of app gets. A
    # scaffolder stamps it on the Application XR as the label adhar.io/dashboard-type.
    adhar.io/dashboard-type: batch-jvm
    # What each environment runs: a BatchJob (platform.adhar.io/v1alpha1), which
    # the platform composes into a CronJob, a run template and alert rules —
    # not a Rollout. On the Application XR (as this label, or as
    # spec.parameters.type: batch) it is what makes the delivery chain verify a
    # run-to-completion workload by its runs rather than by ready pods, and
    # what puts the application in the Console's Batch area (design 0025).
    adhar.io/workload: batch
  title: Spring Batch Job (Adhar Kit)
  description: >-
    A Spring Batch job on Adhar's BatchJob API: declared once in Git, run by the
    platform as one Kubernetes run per business day, restartable from its last
    commit, with its own backed-up PostgreSQL for the Spring Batch metadata.
    The scaffold includes a sample partitioned chunk job, optional Kafka events,
    and a cron or on-demand execution model. The Console and `adhar batch run`
    start runs from the template the platform composes; alerts on failed, late,
    stuck and OOM-killed runs come with it.
  tags:
    - recommended
    - java
    - springboot
    - spring-batch
    - batch
    - adhar-kit
    - supply-chain
    - observability
    - postgres
    - kafka
spec:
  owner: group:platform-engineers
  type: service

  parameters:
    - title: Application
      required: [name]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the batch job (lowercase, DNS-friendly)
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Job
      properties:
        batchMode:
          title: Execution model
          type: string
          enum: [cron, on-demand]
          default: cron
          description: Cron-based recurring execution (suspended in dev, live in test and prod), or on demand only — started from the Console or `adhar batch run`.
        schedule:
          title: Cron schedule
          type: string
          default: "0 2 * * *"
          description: A 5-field cron expression, evaluated in the time zone below. Ignored for an on-demand job.
        timeZone:
          title: Time zone
          type: string
          default: UTC
          description: The IANA time zone of the schedule and of the business date each run processes.
        maxDurationMinutes:
          title: Maximum run duration (minutes)
          type: integer
          default: 180
          minimum: 5
          description: A run longer than this raises the BatchRunTooLong alert; the platform's hard stop is six hours.
        withKafka:
          title: Kafka event stream
          type: boolean
          default: false
          description: Provisions a Kafka cluster and topic for the job, and hands the run its bootstrap address.

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - adhar.localtest.me:8443

    - title: Operations
      description: Operational metadata used by the catalog, the alerts and the platform scorecard.
      properties:
        lifecycle:
          title: Lifecycle
          type: string
          description: experimental while it is being built, production once it is GA, deprecated when it is being retired.
          enum: [experimental, production, deprecated]
          default: experimental
        tier:
          title: Tier
          type: string
          description: How much the business depends on it.
          enum: [critical, high, standard, low]
          default: standard
        docsUrl:
          title: Documentation URL
          type: string
          description: Leave empty to point at the repository's docs/ folder.
          default: ""
        runbookUrl:
          title: Runbook URL
          type: string
          description: What to do when it pages. Linked from the catalog and the scorecard.
          default: ""
        oncall:
          title: On-call
          type: string
          description: Team or channel paged for this job, e.g. "#team-payments-oncall".
          default: ""
        enableAlerts:
          title: Alert on failed, late, stuck and OOM-killed runs
          type: boolean
          description: The platform composes a PrometheusRule per environment from the BatchJob (adhar.io/alerts).
          default: true

  steps:
    - id: template
      name: Generate the batch job
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          schedule: ${{ parameters.schedule }}
          batchMode: ${{ parameters.batchMode }}
          timeZone: ${{ parameters.timeZone or 'UTC' }}
          maxDurationMinutes: ${{ parameters.maxDurationMinutes or 180 }}
          # No longer a choice: the Spring Batch JobRepository is the job's own
          # PostgreSQL (deploy/base/database.yaml). The platform's BatchJob API
          # requires it, and adhar-kit-batch refuses an in-memory repository,
          # because a run that cannot be restarted from its last commit is run
          # twice instead. The skeleton still reads the key for its tooling.
          withDatabase: true
          withKafka: ${{ parameters.withKafka }}
          kafkaTopic: ${{ parameters.kafkaTopic or 'events' }}
          kafkaPartitions: ${{ parameters.kafkaPartitions or 3 }}
          lifecycle: ${{ parameters.lifecycle }}
          tier: ${{ parameters.tier }}
          docsUrl: ${{ parameters.docsUrl }}
          runbookUrl: ${{ parameters.runbookUrl }}
          oncall: ${{ parameters.oncall }}
          enableAlerts: ${{ parameters.enableAlerts }}
          port: 8080
          gitOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          giteaHost: ${{ (parameters.repoUrl | parseRepoUrl).host }}

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD deployment
      action: adhar:create-argocd-app
      input:
        appName: ${{ parameters.name }}
        appNamespace: adhar-system
        argoInstance: local
        projectName: default
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: "deploy"

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
