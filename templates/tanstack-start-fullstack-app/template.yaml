apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: tanstack-start-fullstack-app
  title: TanStack Start Fullstack App (Adhar UI)
  description: >-
    A fullstack React app built with TanStack Start (SSR + server routes),
    pre-wired with the Adhar UI design system (@adhar-ui/react + Tailwind v4).
    Runs as a Node server, shipped through Adhar's secure supply chain — trivy
    scan + cosign sign, kyverno verification, GitOps deploy with Argo Rollouts,
    OpenTelemetry, and an optional CloudNativePG database.
  tags:
    - recommended
    - react
    - tanstack
    - fullstack
    - adhar-ui
    - supply-chain
    - observability
spec:
  owner: group:platform-engineers
  type: service

  parameters:
    - title: Application
      required: [name]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the app (lowercase, DNS-friendly)
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Runtime
      properties:
        replicas:
          title: Replicas
          type: integer
          default: 1
          minimum: 1
          maximum: 5
        withDatabase:
          title: Provision a PostgreSQL database
          type: boolean
          default: false
          description: >-
            Creates a managed CloudNativePG Postgres cluster and injects
            DATABASE_URL for use in server routes.

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - adhar.localtest.me:8443

  steps:
    - id: template
      name: Generate the app
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          replicas: ${{ parameters.replicas }}
          withDatabase: ${{ parameters.withDatabase }}
          port: 3000
          hostname: ${{ parameters.name }}.adhar.localtest.me
          gitOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD deployment
      action: adhar:create-argocd-app
      input:
        appName: ${{ parameters.name }}
        appNamespace: adhar-system
        argoInstance: local
        projectName: default
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: "deploy"

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
