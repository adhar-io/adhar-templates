apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: redis-cache
  title: Redis / Valkey Cache
  description: >-
    Self-service Redis-compatible (Valkey) cache, provisioned through the Adhar
    control plane (Crossplane) as a Database (engine: redis). A
    connection Secret `<name>-app` (uri, host, port) is created in your namespace.
  tags:
    - recommended
    - redis
    - valkey
    - cache
    - self-service
    - crossplane
spec:
  owner: group:platform-engineers
  type: resource

  parameters:
    - title: Cache
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        namespace:
          title: Namespace
          type: string
          default: adhar-system

  steps:
    - id: render
      name: Render the cache claim
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}

    - id: apply
      name: Provision via Crossplane
      action: adhar:kubernetes:apply
      input:
        namespaced: true
        manifestPath: cache.yaml
        clusterName: local

  output:
    text:
      - title: Provisioning
        content: |
          Cache **${{ parameters.name }}** is being provisioned. Connect via
          Secret `${{ parameters.name }}-app` (uri: redis://…:6379) in namespace
          `${{ parameters.namespace }}`.
