# The application, as the control plane sees it (ADR-0026). One object; the
# Application composition observes the project for its environments,
# then creates the Argo CD Applications, the Kargo Warehouse and the Kargo
# Stages. Promotion policy, credentials and the AppProject belong to the project.
apiVersion: platform.adhar.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: adhar-system
  labels:
    adhar.io/project: ${{ values.project }}
    adhar.io/application: ${{ values.name }}
spec:
  parameters:
    project: ${{ values.project }}
    displayName: ${{ values.name }}
    source:
      repoURL: ${{ values.repoURL }}
      path: ${{ values.path }}
      targetRevision: ${{ values.targetRevision }}
