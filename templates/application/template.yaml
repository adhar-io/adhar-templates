apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: application
  title: Application (GitOps)
  description: >-
    Deploy an existing Git repo as a GitOps Application via the Adhar control
    plane (Crossplane Application → ArgoCD Application).
  tags: [recommended, application, gitops, argocd, self-service, crossplane]
spec:
  owner: group:platform-engineers
  type: resource
  parameters:
    - title: Application
      required: [name, owner, project, repoURL]
      properties:
        name: { title: Name, type: string, pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$', ui:autofocus: true }
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        project:
          title: Project
          type: string
          default: adhar
          description: The Project this application belongs to. Its environments (namespaces, promotion policy, team access) come from the project.
        repoURL: { title: Git repo URL, type: string, description: 'e.g. http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/my-app' }
        path: { title: Deploy directory in the repo, type: string, default: deploy, description: 'Holds base/ and envs/<env>/ kustomize overlays (the paved road writes them)' }
        targetRevision: { title: Revision, type: string, default: main }
  steps:
    - id: render
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          project: ${{ parameters.project }}
          repoURL: ${{ parameters.repoURL }}
          path: ${{ parameters.path }}
          targetRevision: ${{ parameters.targetRevision }}
    - id: apply
      action: adhar:kubernetes:apply
      input:
        namespaced: true
        manifestPath: application.yaml
        clusterName: local
  output:
    text:
      - title: Deploying
        content: |
          Application **${{ parameters.name }}** registered in project `${{ parameters.project }}`.
          The control plane composes one Argo CD Application per environment of the project
          (deploying `${{ parameters.path }}/envs/<env>`), a Kargo Warehouse for its image and a
          Kargo Stage per environment: dev and test promote automatically, prod through a Release.
