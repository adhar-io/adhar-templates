apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: springboot-hexagon-service
  title: Spring Boot Hexagonal Service (Adhar Kit)
  description: >-
    A Spring Boot microservice structured with hexagonal (ports & adapters)
    architecture and pre-configured with Adhar Kit. Domain logic is isolated
    behind inbound/outbound ports; a REST adapter drives it and a persistence
    adapter (in-memory, or JDBC when a database is provisioned) backs it. Shipped
    through Adhar's secure supply chain with Argo Rollouts and OpenTelemetry.
  tags:
    - java
    - springboot
    - hexagonal
    - adhar-kit
    - supply-chain
    - observability
spec:
  owner: group:platform-engineers
  type: service

  parameters:
    - title: Application
      required: [name]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the service (lowercase, DNS-friendly)
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Runtime
      properties:
        replicas:
          title: Replicas
          type: integer
          default: 1
          minimum: 1
          maximum: 5
        withDatabase:
          title: Provision a PostgreSQL database
          type: boolean
          default: false
          description: >-
            Provisions CloudNativePG and switches the outbound persistence
            adapter from in-memory to JDBC.

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - adhar.localtest.me:8443

  steps:
    - id: verify
      name: Verify platform dependencies
      action: cnoe:verify:dependency
      input:
        verifiers:
          - kind: CustomResourceDefinition
            group: kpack.io
            version: v1alpha2
            plural: clusterbuilders

    - id: template
      name: Generate the service
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          replicas: ${{ parameters.replicas }}
          withDatabase: ${{ parameters.withDatabase }}
          port: 8080
          hostname: ${{ parameters.name }}.adhar.localtest.me
          gitOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD deployment
      action: cnoe:create-argocd-app
      input:
        appName: ${{ parameters.name }}
        appNamespace: adhar-system
        argoInstance: local
        projectName: default
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: "deploy"

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
