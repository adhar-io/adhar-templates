spring.application.name=${{ values.name }}
server.port=${PORT:8080}

# Tracing: adhar-kit exports spans over OTLP/HTTP to the endpoint in the Rollout's
# OTEL_EXPORTER_OTLP_ENDPOINT (Alloy -> Tempo), samples every trace by default and
# reads OTEL_SERVICE_NAME / OTEL_RESOURCE_ATTRIBUTES / OTEL_TRACES_SAMPLER_ARG.
# Spring Boot's own management.otlp.* settings had no effect here: Boot's tracing
# modules are not on the classpath, the kit's SDK is the one exporting.

# Actuator: expose health (with k8s liveness/readiness probes), info, metrics.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Client errors answer as client errors. adhar-kit-commons 0.1.0's exception
# handler turns every exception it does not know into a 500 — including Spring
# MVC's own 404 (no such path), 405 (wrong method) and 400 (missing or unreadable
# body) — which also counts them against the 5xx alert. Spring's RFC 9457
# handler takes precedence over it and answers those with their real status and
# a problem-detail body; the kit still handles its own exception types. Caught
# by the API tests in src/test/resources/karate.
spring.mvc.problemdetails.enabled=true
{%- if values.withAuth %}

# Authentication (Adhar Kit security). Every endpoint requires a bearer JWT from
# the platform's Keycloak realm `adhar`, checked against the realm's signing
# keys, EXCEPT the landing page `/` and the actuator — so the service's route
# visibly answers in a browser while its APIs stay protected. (A browser at `/`
# used to get a bare 401, which reads as "the route is broken".)
#
# The default JWKS address is the platform's in-cluster Keycloak. Override it
# with ADHAR_JWT_JWK_SET_URI when running outside the cluster, e.g.
# https://keycloak.<platform-domain>/realms/adhar/protocol/openid-connect/certs.
adhar.security.jwt.jwk-set-uri=${ADHAR_JWT_JWK_SET_URI:http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/certs}
adhar.security.authorization.permit-all=/,/actuator/**
{%- else %}

# Authentication is off: every endpoint is public. To require a Keycloak JWT, set
# adhar.security.jwt.jwk-set-uri (see the docs) and remove this line.
adhar.security.authorization.permit-all=/**
{%- endif %}
{%- if values.withDatabase %}

# Database — wired from the CloudNativePG secret via the Rollout env.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=always
{%- endif %}

# Request-latency histogram buckets, so the catalog Metrics tab and the
# per-application Grafana dashboard can draw p50/p95 (Micrometer emits only
# count/sum by default).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
