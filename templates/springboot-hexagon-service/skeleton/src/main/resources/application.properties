spring.application.name=${{ values.name }}
server.port=${PORT:8080}

# OpenTelemetry (Micrometer Tracing + OTLP). Endpoint comes from the Rollout's
# OTEL_EXPORTER_OTLP_ENDPOINT env; Alloy fans out to Tempo/Mimir/Loki.
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}/v1/metrics
management.otlp.metrics.export.step=10s
management.tracing.sampling.probability=1.0

# Actuator: expose health (with k8s liveness/readiness probes), info, metrics.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
{%- if values.withDatabase %}

# Database — wired from the CloudNativePG secret via the Rollout env.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=always
{%- endif %}
