# The service's HTTP interface, published in the catalog as
# ${{ values.name }}-api (catalog-info.yaml) and listed by the Console under
# Design → API & Spec. This file is the contract: keep it in step with the
# inbound adapter, src/main/java/io/adhar/service/adapter/in/web/ — the Karate
# features in src/test/resources/karate check the running service against
# these paths. Nothing generates a document at runtime (springdoc is not on
# the classpath); if it is added, what it serves at /v3/api-docs must agree
# with this file.
openapi: 3.1.0
info:
  title: ${{ values.name }}
  version: 0.1.0
  description: ${{ (values.description or 'A Spring Boot service on the Adhar platform.') | dump }}
servers:
  # dev. Each environment serves its own host: <name>.<environment>.<platform domain>.
  - url: https://${{ values.hostname }}
{%- if values.withAuth %}
# Every operation needs a bearer JWT from the platform's Keycloak realm `adhar`
# (adhar.security.* in application.properties), except the landing page and
# the actuator, which say `security: []` below.
security:
  - bearerAuth: []
{%- endif %}
paths:
  /:
    get:
      operationId: index
      summary: What this service is.
{%- if values.withAuth %}
      security: []
{%- endif %}
      responses:
        "200":
          description: The service's name and status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
        "405":
          description: Any other method. Errors answer as RFC 9457 problems (spring.mvc.problemdetails).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /greet:
    post:
      operationId: greet
      summary: Creates a greeting through the GreetingUseCase port and stores it through the persistence port{% if values.withDatabase %} (the JDBC adapter, PostgreSQL){% else %} (in memory, until a database adapter is added){% endif %}.
      parameters:
        - name: name
          in: query
          required: false
          description: Who to greet. Missing or blank greets the World.
          schema:
            type: string
      responses:
        "200":
          description: The greeting, with the id it was stored under.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
{%- if values.withAuth %}
        "401":
          $ref: "#/components/responses/Unauthorized"
{%- endif %}
        "405":
          description: GET is not accepted — a greeting is created, not read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /greetings:
    get:
      operationId: greetings
      summary: Every greeting stored so far, in the order they were created.
      responses:
        "200":
          description: The greetings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Greeting"
{%- if values.withAuth %}
        "401":
          $ref: "#/components/responses/Unauthorized"
{%- endif %}
  # Actuator also exposes /actuator/info and /actuator/metrics, with Spring
  # Boot's own schemas; they are not repeated here.
  /actuator/health:
    get:
      operationId: health
      summary: Actuator health, aggregated over every indicator.
      tags: [actuator]
{%- if values.withAuth %}
      security: []
{%- endif %}
      responses:
        "200":
          description: UP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: DOWN or OUT_OF_SERVICE — an indicator is failing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /actuator/health/liveness:
    get:
      operationId: liveness
      summary: The Kubernetes liveness probe (deploy/base/rollout.yaml).
      tags: [actuator]
{%- if values.withAuth %}
      security: []
{%- endif %}
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Broken — the kubelet restarts the container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /actuator/health/readiness:
    get:
      operationId: readiness
      summary: The Kubernetes readiness probe (deploy/base/rollout.yaml).
      tags: [actuator]
{%- if values.withAuth %}
      security: []
{%- endif %}
      responses:
        "200":
          description: Ready to take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready — the Service stops sending traffic to this pod.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /actuator/prometheus:
    get:
      operationId: prometheus
      summary: Metrics in the Prometheus text format, scraped by the platform's PodMonitor; includes the http_server_requests_seconds histogram the dashboard draws p50/p95 from.
      tags: [actuator]
{%- if values.withAuth %}
      security: []
{%- endif %}
      responses:
        "200":
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string
components:
{%- if values.withAuth %}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token from the platform's Keycloak realm `adhar`, verified against the realm's signing keys.
  responses:
    Unauthorized:
      description: No bearer token, or one the service cannot verify.
{%- endif %}
  schemas:
    ServiceInfo:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
          description: ${{ values.name }}
        status:
          type: string
          enum: [ok]
    Greeting:
      type: object
      description: The domain model (src/main/java/io/adhar/service/domain/model/Greeting.java), as JSON.
      required: [id, message]
      properties:
        id:
          type: integer
          format: int64
          description: Unique and increasing.
        message:
          type: string
          description: "`Hello, <name>!`"
    Health:
      type: object
      description: Only `status` unless management.endpoint.health.show-details is raised.
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    Problem:
      type: object
      description: An RFC 9457 problem detail.
      required: [status, title]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: The request path.
