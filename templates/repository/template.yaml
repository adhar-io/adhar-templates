apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: repository
  title: Repository
  description: >-
    An empty Gitea repository registered in the catalog. Use when an Application
    needs an additional source/config repo beyond the one its Project provides.
  tags: [repository, gitops, source]
spec:
  owner: group:platform-engineers
  type: resource
  parameters:
    - title: Repository
      required: [name, owner, repoUrl]
      properties:
        name: { title: Name, type: string, pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$', ui:autofocus: true }
        description: { title: Description, type: string, default: "" }
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter: { kind: [Group, User] }
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [adhar.localtest.me:8443]
  steps:
    - id: render
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
    - id: publish
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
    - id: register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
