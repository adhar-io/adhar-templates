{%- if values.withDatabase %}
# Managed PostgreSQL via CloudNativePG. The operator creates a Secret
# `${{ values.name }}-db-app` containing a ready-to-use `uri` (DATABASE_URL),
# which rollout.yaml injects into the app. ServerSideApply is required for CNPG
# Clusters (otherwise ArgoCD's sync force-fails and drops the workload).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${{ values.name }}-db
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    app: ${{ values.name }}
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Backed up from day one. Every platform database ships with WAL archiving to
  # the platform object store plus a daily base backup (ADR-0021); a service
  # database that did not was the most common reason a golden-path service
  # scored below B on the readiness scorecard, and a database with no backup is
  # not "managed" in any sense that matters at 3am.
  #
  # Credentials are the platform's S3 root credential, read by reference — the
  # same Secret every other CNPG cluster uses. Nothing here holds a key.
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      destinationPath: s3://adhar-backups/cnpg/${{ values.name }}-db
      endpointURL: http://rustfs.adhar-system.svc.cluster.local:9000
      wal:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: root-creds
          key: rootUser
        secretAccessKey:
          name: root-creds
          key: rootPassword
---
# The base backup the WAL archive above is restored onto. WAL alone is a log
# with nowhere to replay from.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${{ values.name }}-db-daily
  labels:
    app: ${{ values.name }}
spec:
  # 03:xx — after the platform's own databases (02:30–02:55), so a fleet of
  # services does not contend with Keycloak and Gitea for the object store.
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  cluster:
    name: ${{ values.name }}-db
{%- endif %}
