# Secure build — runs on every ArgoCD sync (i.e. when you push code), as a Sync
# hook so it re-runs cleanly instead of drifting. The build-node pipeline
# (from the supply-chain package) does, in order:
#   git-clone → buildpacks build → push to Harbor → trivy scan → cosign sign.
# Only a scanned + signed image lands in Harbor; kyverno then admits only that
# signed image (see rollout.yaml).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ${{ values.name }}-build
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: ${{ values.name }}
    adhar.io/supply-chain: "true"
spec:
  pipelineRef:
    name: build-node
  taskRunTemplate:
    serviceAccountName: adhar-pipeline
  params:
    - name: git-url
      value: "http://gitea-http.adhar-system.svc.cluster.local:3000/${{ values.gitOwner }}/${{ values.repoName }}"
    - name: revision
      value: main
    - name: image
      value: "harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}"
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
