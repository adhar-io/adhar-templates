# Cloud Native Buildpacks project descriptor. app-ci (buildpacks-build) hands
# every [[build.env]] below to the buildpacks; `builder` records the builder it
# uses, for `pack build` on a laptop.
#
# The image runs package.json's "start" script, `node dist/server.js` (the
# npm-start buildpack picks it up; there is no Dockerfile), and
# deploy/base/rollout.yaml adds the OpenTelemetry preload through NODE_OPTIONS.
[project]
id = "io.adhar.${{ values.name }}"
name = "${{ values.name }}"
version = "1.0.0"

[build]
builder = "paketobuildpacks/builder-jammy-base"

# The runtime the image ships: Node.js 24. app-ci's tests run on the
# same version (detect-toolchain reads this before anything else), so what was
# tested is what runs. Change it here, and only here.
#
# Pinned to a major on purpose. Left to an open range (package.json "engines":
# ">=20"), node-engine picks the NEWEST Node it carries, and Node 26's binary
# needs libatomic.so.1, which the jammy-base run image does not ship: the image
# builds, passes its scans, and every pod then dies at start with
# "node: error while loading shared libraries: libatomic.so.1".
[[build.env]]
name = "BP_NODE_VERSION"
value = "24"

# The TypeScript is compiled in the build: node-run-script runs package.json's
# "build" script (tsc, src/ → dist/) with the devDependencies installed, and
# npm-install leaves those out of the image. Without this the image would have
# no dist/ and every pod would die at start with "Cannot find module
# '/workspace/dist/server.js'".
[[build.env]]
name = "BP_NODE_RUN_SCRIPTS"
value = "build"
