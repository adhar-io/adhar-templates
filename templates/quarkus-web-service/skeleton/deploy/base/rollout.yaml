# Progressive delivery with Argo Rollouts (canary). The image is the SIGNED
# Harbor image; the kyverno verify-supply-chain-images policy admits it only if
# cosign-signed, and mutates :latest to the verified digest — so what runs is
# exactly what was scanned + signed.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: ${{ values.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${{ values.name }}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      # Replicas on different nodes, so one node failing cannot take the
      # service down (scorecard: spread_across_nodes).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ${{ values.name }}
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: harbor-dockercfg
      containers:
        - name: app
          image: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}:latest
          # Leave the Service's endpoints before the process stops, so
          # in-flight requests finish during a rollout or a node drain
          # (scorecard: graceful_shutdown). The kubelet's own sleep action:
          # it needs no shell in the image.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - containerPort: ${{ values.port }}
          env:
            - name: PORT
              value: "${{ values.port }}"
            # OpenTelemetry — where the telemetry goes: the Alloy collector, which
            # forwards traces to Tempo and metrics to Mimir. application.properties
            # hands this endpoint to Quarkus's OWN exporters: traces through
            # quarkus-opentelemetry, metrics through micrometer's OTLP registry.
            # Logs go to stdout, which Alloy collects into Loki.
            - name: OTEL_SERVICE_NAME
              value: "${{ values.name }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.adhar-system.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            # The pod's namespace and name, so the OTLP metrics carry
            # k8s_namespace_name / k8s_pod_name in Mimir: the app's Grafana
            # dashboard selects an environment by them (the same image runs in
            # dev, test and prod, so nothing baked in can tell them apart).
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=adhar,deployment.environment=local,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)"
            # No OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER or OTEL_LOGS_EXPORTER
            # here. Any one of them set to "otlp" makes the OpenTelemetry SDK inside
            # Quarkus build the SDK's own OTLP exporter in place of Quarkus's, and
            # that exporter needs an HTTP sender (okhttp or the JDK one) Quarkus does
            # not ship: the application stops at startup with "No HttpSenderProvider
            # found on classpath" and the pod crash-loops (qua-service, 2026-10-31).
            # The SDK reads these straight from the environment, so no
            # quarkus.otel.* setting in application.properties can override them.
            # RolloutEnvIT (src/test/java) starts the packaged application with
            # exactly this environment, so the build fails before a pod would.
{%- if values.withDatabase %}
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-db-app
                  key: jdbc-uri
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-db-app
                  key: password
{%- endif %}
          readinessProbe:
            httpGet:
              path: /healthz
              port: ${{ values.port }}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: ${{ values.port }}
            initialDelaySeconds: 10
          # A JVM cannot start in 128Mi.
          #
          # The Paketo memory calculator sizes fixed regions from the container
          # limit and refuses to launch when they do not fit — at 128Mi it needs
          # ~838M for metaspace, code cache and thread stacks alone and the pod
          # crash-loops with "fixed memory regions require 838503K which is
          # greater than 128M available for allocation". That reads as a broken
          # image rather than a limit set below the runtime's floor.
          #
          # The request stays modest so scheduling is cheap; the LIMIT is what the
          # calculator reads. Lower it and the service stops starting.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
