quarkus.application.name=${{ values.name }}
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
# The integration tests start the packaged app on a free port, not 8081.
quarkus.http.test-port=0

# OpenTelemetry — endpoint from the Rollout's OTEL_EXPORTER_OTLP_ENDPOINT env.
# Traces via quarkus-opentelemetry, metrics via micrometer-registry-otlp; logs
# go to stdout and are collected to Loki.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.micrometer.export.otlp.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}/v1/metrics
{%- if values.withDatabase %}

# Database. The connection comes from the QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD env vars (the
# Rollout sets them from the CNPG secret), which Quarkus maps onto
# quarkus.datasource.* by name. They are deliberately not repeated here: a
# configured URL switches Dev Services off, and Dev Services is what starts the
# PostgreSQL container the integration tests (and `quarkus dev`) run against.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
{%- endif %}
