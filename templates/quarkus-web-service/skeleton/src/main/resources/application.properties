quarkus.application.name=${{ values.name }}
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# OpenTelemetry — endpoint from the Rollout's OTEL_EXPORTER_OTLP_ENDPOINT env.
# Traces via quarkus-opentelemetry, metrics via micrometer-registry-otlp; logs
# go to stdout and are collected to Loki.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.micrometer.export.otlp.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}/v1/metrics
{%- if values.withDatabase %}

# Database — QUARKUS_DATASOURCE_* env (from the CNPG secret) map to these.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
{%- endif %}
