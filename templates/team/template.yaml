apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: team
  title: Team
  description: >-
    A Team within an Organisation (Backstage Group). Teams own Projects. Members
    of a Team get access to the Projects they own and everything inside them.
  tags: [team, hierarchy, ownership]
spec:
  owner: group:platform-engineers
  type: team
  parameters:
    - title: Team
      required: [teamId, organisation, repoUrl]
      properties:
        teamId:
          title: Team ID
          type: string
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        organisation:
          title: Organisation
          type: string
          description: Parent organisation
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group]
              spec.type: organisation
        displayName: { title: Display name, type: string }
        description: { title: Description, type: string, default: "" }
        repoUrl:
          title: Catalog repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [adhar.localtest.me:8443]
  steps:
    - id: render
      action: fetch:template
      input:
        url: ./skeleton
        values:
          teamId: ${{ parameters.teamId }}
          organisation: ${{ parameters.organisation }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
    # The team as a control-plane object (ADR-0026): publishes the group every
    # project binds (ws-team-<id>) and creates the Gitea team in the organisation.
    - id: apply
      action: adhar:kubernetes:apply
      input:
        namespaced: true
        manifestPath: team.yaml
        clusterName: local
    - id: publish
      action: publish:gitea
      input:
        description: "Adhar team ${{ parameters.teamId }}"
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
    - id: register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Team in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
