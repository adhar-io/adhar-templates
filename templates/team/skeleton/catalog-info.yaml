apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: ${{ values.teamId }}
  title: ${{ values.displayName }}
  description: ${{ values.description }}
  annotations:
    adhar.io/hierarchy: team
spec:
  type: team
  parent: ${{ values.organisation }}
  profile:
    displayName: ${{ values.displayName }}
  children: []
