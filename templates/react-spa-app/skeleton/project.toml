# Cloud Native Buildpacks build config. The Node.js buildpack runs `npm run
# build` (Vite → dist/), then the web-servers buildpack serves dist/ with nginx.
# ENABLE_PUSH_STATE makes nginx serve index.html for client-side routes (SPA).
[[build.env]]
name = "BP_NODE_RUN_SCRIPTS"
value = "build"

[[build.env]]
name = "BP_WEB_SERVER"
value = "nginx"

[[build.env]]
name = "BP_WEB_SERVER_ROOT"
value = "dist"

[[build.env]]
name = "BP_WEB_SERVER_ENABLE_PUSH_STATE"
value = "true"
{%- if values.withLocalisation %}

# /i18n/<language>.json: proxied to Tolgee at runtime, with the translations
# built into dist/i18n/ as the fallback. The buildpack includes this file in
# the server block of the nginx.conf it generates and renders its env
# templates at container start.
[[build.env]]
name = "BP_WEB_SERVER_INCLUDE_FILE_PATH"
value = "nginx-i18n.conf"
{%- endif %}
