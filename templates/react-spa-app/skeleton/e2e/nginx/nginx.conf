# The nginx.conf the nginx buildpack generates for this app (BP_WEB_SERVER=nginx,
# BP_WEB_SERVER_ENABLE_PUSH_STATE=true, BP_WEB_SERVER_INCLUDE_FILE_PATH), cut
# down to what nginx-app.conf and its caching headers depend on, for
# e2e/nginx/test.sh. The real template is
# https://github.com/paketo-buildpacks/nginx/blob/main/assets/default.conf.
worker_processes 1;
daemon off;
error_log stderr;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  access_log off;
  port_in_redirect off;
  server_tokens off;

  gzip on;
  gzip_static always;
  gzip_proxied any;
  gzip_min_length 1100;
  gzip_types text/plain text/css text/js text/xml text/javascript application/javascript
    application/x-javascript application/json application/xml application/xml+rss
    font/eot font/otf font/ttf image/svg+xml;
  gzip_vary on;
  gunzip on;

  server {
    listen 8080 default_server;
    server_name _;
    root /workspace/WEB_ROOT;

    location / {
      if (!-e $request_filename) {
        rewrite ^(.*)$ / break;
      }
      index index.html index.htm Default.htm;
    }

    location ~ /\.(?!well-known) {
      deny all;
      return 404;
    }
    include nginx-app.conf;
  }
}
