# Progressive delivery with Argo Rollouts (canary). The image is the SIGNED
# nginx image built by buildpacks; kyverno admits it only if cosign-signed and
# mutates :latest to the verified digest.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: ${{ values.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${{ values.name }}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      # Replicas on different nodes, so one node failing cannot take the
      # service down (scorecard: spread_across_nodes).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ${{ values.name }}
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: harbor-dockercfg
      containers:
        - name: app
          image: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}:latest
          # Leave the Service's endpoints before the process stops, so
          # in-flight requests finish during a rollout or a node drain
          # (scorecard: graceful_shutdown). The kubelet's own sleep action:
          # it needs no shell in the image.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Browser telemetry, served to the page as /runtime-config.json
            # (nginx-app.conf, src/telemetry.js). APP_ENVIRONMENT is set by each
            # overlay (deploy/envs/<env>); FARO_URL is the platform's Faro
            # receiver, its public route, because the browser posts to it. Empty
            # turns real-user monitoring off.
            - name: APP_ENVIRONMENT
              value: ""
            - name: FARO_URL
              value: "{% if values.platformBaseDomain %}https://faro.${{ values.platformBaseDomain }}/collect{% endif %}"
{%- if values.withAnalytics %}
            # PostHog product analytics, from the optional Secret <app>-posthog
            # (keys api-key, host, ui-host, session-replay) the platform creates
            # with this environment's project key. Without it analytics is off
            # and /ingest answers 404. `host` is where /ingest forwards to, the
            # in-cluster capture service
            # (http://posthog-events.adhar-system.svc.cluster.local:8000).
            - name: POSTHOG_KEY
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-posthog, key: api-key, optional: true}
            - name: POSTHOG_HOST
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-posthog, key: host, optional: true}
            - name: POSTHOG_UI_HOST
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-posthog, key: ui-host, optional: true}
            - name: POSTHOG_SESSION_REPLAY
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-posthog, key: session-replay, optional: true}
{%- endif %}
{%- if values.withLocalisation %}
            # Tolgee, for /i18n/<language>.json (nginx-app.conf). The platform
            # creates the Secret with a READ-ONLY project key when it creates the
            # app's Tolgee project. Every key is optional: without the Secret the
            # app starts and serves the translations built into the image.
            - name: TOLGEE_API_URL
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-tolgee, key: api-url, optional: true}
            - name: TOLGEE_PROJECT_ID
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-tolgee, key: project-id, optional: true}
            - name: TOLGEE_API_KEY
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-tolgee, key: api-key, optional: true}
{%- endif %}
{%- if values.withCms %}
            # Strapi, the platform CMS, for /cms/ and /uploads/ (nginx-app.conf). Both keys
            # of the Secret <app>-strapi are optional: without api-token the app
            # starts and shows its setup hint; without api-url the platform's
            # shared Strapi (http://strapi.adhar-system.svc.cluster.local:1337)
            # is used. The token must be READ-ONLY — see docs/architecture.md.
            - name: STRAPI_API_TOKEN
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-strapi, key: api-token, optional: true}
            - name: STRAPI_URL
              valueFrom:
                secretKeyRef: {name: ${{ values.name }}-strapi, key: api-url, optional: true}
{%- endif %}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
