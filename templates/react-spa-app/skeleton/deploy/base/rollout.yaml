# Progressive delivery with Argo Rollouts (canary). The image is the SIGNED
# nginx image built by buildpacks; kyverno admits it only if cosign-signed and
# mutates :latest to the verified digest.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: ${{ values.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${{ values.name }}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      imagePullSecrets:
        - name: harbor-dockercfg
      containers:
        - name: app
          image: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
