<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="${{ values.description | escape }}" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/adhar-symbol.svg" />
    <title>${{ values.name }}</title>
    <script>
      // Apply the saved (or system) theme before first paint — no flash.
      try {
        const saved = localStorage.getItem('theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
    <script>
      // A deploy replaces the files under /assets/, each named after a hash of
      // its content. A page from before it, or a Pod of the other version
      // mid-rollout, can ask for one that no longer exists — or the browser can
      // hold a bad copy of one (index.html, which nginx used to answer such names
      // with) — and the app never starts. Reload ONCE to get the running build.
      // A second failure on the same path leaves the page as it is instead of
      // looping; the guard is per tab and path, and clears once a load has stayed
      // healthy for ten seconds. Without sessionStorage there is no guard, so no
      // reload.
      ;(function () {
        var failed = false
        function ours(url) {
          if (!url) return ''
          try {
            var u = new URL(url, location.href)
            return u.origin === location.origin && u.pathname.indexOf('/assets/') === 0 ? u.href : ''
          } catch (e) {
            return ''
          }
        }
        function recover(url) {
          if (failed) return
          failed = true
          var key = 'adhar:asset-reload:' + location.pathname
          var reload = false
          // Reload only once the guard is recorded and reads back: storage that
          // refuses the write (full, or a private mode) must mean no reload, or
          // every load would reload again.
          try {
            var spent = sessionStorage.getItem(key)
            sessionStorage.setItem(key, '1')
            reload = !spent && sessionStorage.getItem(key) === '1'
          } catch (e) {}
          var done = false
          var next = function () {
            if (done) return
            done = true
            if (reload) location.reload()
          }
          if (!url) return next()
          // A reload revalidates the page but not the files it loads, so the
          // failed file is fetched past the cache first: a bad copy stored under
          // its name is replaced — also when the guard is spent, so that the
          // person's own reload works.
          fetch(url, { cache: 'reload' }).then(next, next)
          setTimeout(next, 3000)
        }
        addEventListener(
          'error',
          function (event) {
            var el = event.target
            var url = ours(el instanceof HTMLScriptElement ? el.src : el instanceof HTMLLinkElement ? el.href : '')
            if (url) recover(url)
          },
          true
        )
        // Vite's event for a lazily loaded part of the app that failed to load;
        // the browser's message names the file where it can.
        addEventListener('vite:preloadError', function (event) {
          var file = /\S*\/assets\/\S+/.exec(String(event.payload && event.payload.message))
          recover(file ? ours(file[0]) : '')
        })
        addEventListener('load', function () {
          var key = 'adhar:asset-reload:' + location.pathname
          setTimeout(function () {
            if (failed) return
            try {
              sessionStorage.removeItem(key)
            } catch (e) {}
          }, 10000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
