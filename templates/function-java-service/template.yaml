apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: function-java-service
  labels:
    adhar.io/dashboard-type: backend-generic
  title: Function Service (Java)
  description: >-
    A serverless Function XR template for Adhar. It scaffolds a Java
    function repo and a deploy manifest that provisions `kind: Function`
    (`platform.adhar.io/v1alpha1`) with Knative scale-to-zero and on-demand
    autoscaling.
  tags:
    - recommended
    - function
    - serverless
    - knative
    - java
spec:
  owner: group:platform-engineers
  type: service
  parameters:
    - title: Function
      required: [name]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the function (lowercase, DNS-friendly)
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this function do?
        owner:
          title: Owner
          type: string
          description: Team that owns this function
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
    - title: Runtime
      properties:
        trigger:
          title: Trigger
          type: string
          enum: [http, cloudevent, topic, bucket, cron]
          default: http
        eventSource:
          title: Event source
          type: string
          default: ""
          description: Optional source for non-HTTP triggers, e.g. kafka://orders-events
        timeoutSeconds:
          title: Timeout (seconds)
          type: integer
          default: 30
          minimum: 1
          maximum: 300
        minScale:
          title: Min scale
          type: integer
          default: 0
          minimum: 0
          maximum: 20
        maxScale:
          title: Max scale
          type: integer
          default: 10
          minimum: 1
          maximum: 200
    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Gitea repository to create for this function
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - adhar.localtest.me:8443

  steps:
    - id: template
      name: Generate the function
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          trigger: ${{ parameters.trigger }}
          eventSource: ${{ parameters.eventSource }}
          timeoutSeconds: ${{ parameters.timeoutSeconds }}
          minScale: ${{ parameters.minScale }}
          maxScale: ${{ parameters.maxScale }}
          giteaHost: ${{ (parameters.repoUrl | parseRepoUrl).host }}
    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD deployment
      action: adhar:create-argocd-app
      input:
        appName: ${{ parameters.name }}
        appNamespace: adhar-system
        argoInstance: local
        projectName: default
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: "deploy"

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
