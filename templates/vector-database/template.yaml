apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vector-database
  title: Vector Database (Qdrant)
  description: >-
    Self-service Qdrant vector database for embeddings, RAG and semantic search,
    installed and configured through the Adhar control plane (Crossplane
    Vector) in your namespace: a generated API key (plus a read-only
    one), the collections you declare, Prometheus metrics. Connection details land
    in Secret `<name>-api-key`.
  tags:
    - recommended
    - ai
    - vector
    - qdrant
    - self-service
    - crossplane
spec:
  owner: group:platform-engineers
  type: resource

  parameters:
    - title: Database
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          description: Unique name (lowercase, DNS-friendly); also the in-cluster hostname
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        namespace:
          title: Namespace
          type: string
          description: The project environment namespace this store lives in (e.g. shop-dev)
          default: adhar-system
    - title: Ownership
      properties:
        organisation: { title: Organisation, type: string, default: adhar }
        team: { title: Team, type: string, default: platform }
        project: { title: Project, type: string, default: "" }
        environment:
          title: Environment
          type: string
          enum: [dev, test, prod]
          default: dev
    - title: Capacity and collections
      properties:
        replicas:
          title: Nodes
          type: integer
          description: One is a single-node store; two or more run Qdrant's distributed mode
          default: 1
          minimum: 1
          maximum: 5
        storageSize: { title: Storage per node, type: string, default: 10Gi }
        collectionName:
          title: First collection
          type: string
          description: Created once the database is up; add more later on the Vector
          default: documents
          pattern: '^[a-zA-Z0-9_-]+$'
        vectorSize:
          title: Vector size
          type: integer
          description: Embedding dimensions (1536 for text-embedding-3-small, 768 for nomic-embed-text)
          default: 1536
          minimum: 1
        distance:
          title: Distance
          type: string
          enum: [Cosine, Euclid, Dot, Manhattan]
          default: Cosine

  steps:
    - id: render
      name: Render the vector database request
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          owner: ${{ parameters.owner }}
          organisation: ${{ parameters.organisation }}
          team: ${{ parameters.team }}
          project: ${{ parameters.project }}
          environment: ${{ parameters.environment }}
          replicas: ${{ parameters.replicas }}
          storageSize: ${{ parameters.storageSize }}
          collectionName: ${{ parameters.collectionName }}
          vectorSize: ${{ parameters.vectorSize }}
          distance: ${{ parameters.distance }}

    - id: apply
      name: Provision via Crossplane
      action: adhar:kubernetes:apply
      input:
        namespaced: true
        manifestPath: vector.yaml
        clusterName: local

  output:
    text:
      - title: Provisioning
        content: |
          Vector database **${{ parameters.name }}** is being installed by Crossplane.
          REST `http://${{ parameters.name }}.${{ parameters.namespace }}.svc.cluster.local:6333`,
          gRPC on 6334; the API key and URLs land in Secret `${{ parameters.name }}-api-key`
          (keys: api-key, url, grpc-url, host, port, grpc-port) in namespace `${{ parameters.namespace }}`.
          Collection `${{ parameters.collectionName }}` is created once the database answers.
