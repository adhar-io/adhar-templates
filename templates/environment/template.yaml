apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: environment
  title: Environment (Namespace)
  description: >-
    Self-service team namespace with resource quotas and optional default-deny
    NetworkPolicy, via the Adhar control plane (Crossplane Environment).
  tags: [environment, namespace, self-service, crossplane]
spec:
  owner: group:platform-engineers
  type: resource
  parameters:
    - title: Environment
      required: [name, owner]
      properties:
        name: { title: Namespace name, type: string, pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$', ui:autofocus: true }
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        organisation: { title: Organisation, type: string, default: adhar }
        team: { title: Team, type: string, default: platform, description: 'Its Keycloak group ws-team-<team> is bound in the namespace with the role below' }
        project: { title: Project, type: string, default: "", description: 'Optional; an environment composed by a project carries its name' }
        environment: { title: Environment, type: string, enum: [dev, test, prod], default: dev }
        access: { title: Team access, type: string, enum: [admin, edit, view], default: admin, description: 'view for production: changes arrive through a Release' }
        cpuQuota: { title: CPU quota, type: string, default: "2" }
        memoryQuota: { title: Memory quota, type: string, default: 4Gi }
        podQuota: { title: Pod quota, type: integer, default: 20 }
        enableNetworkPolicy: { title: Default-deny NetworkPolicy, type: boolean, default: true }
  steps:
    - id: render
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          organisation: ${{ parameters.organisation }}
          team: ${{ parameters.team }}
          project: ${{ parameters.project }}
          environment: ${{ parameters.environment }}
          access: ${{ parameters.access }}
          cpuQuota: ${{ parameters.cpuQuota }}
          memoryQuota: ${{ parameters.memoryQuota }}
          podQuota: ${{ parameters.podQuota }}
          enableNetworkPolicy: ${{ parameters.enableNetworkPolicy }}
    - id: apply
      action: adhar:kubernetes:apply
      input: { namespaced: true, manifestPath: environment.yaml, clusterName: local }
  output:
    text:
      - title: Created
        content: "Namespace ${{ parameters.name }} created with quotas."
