apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: secret
  title: Secret
  description: >-
    Self-service Kubernetes Secret via the Adhar control plane (Crossplane
    Secret) — create a secret in your namespace without raw Secret RBAC.
  tags: [secret, config, self-service, crossplane]
spec:
  owner: group:platform-engineers
  type: resource
  parameters:
    - title: Secret
      required: [name, owner, key, value]
      properties:
        name: { title: Name, type: string, pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$', ui:autofocus: true }
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        namespace: { title: Namespace, type: string, default: adhar-system }
        key: { title: Key, type: string }
        value: { title: Value, type: string, ui:field: Secret }
  steps:
    - id: render
      action: fetch:template
      input:
        url: ./skeleton
        values: { name: ${{ parameters.name }}, namespace: ${{ parameters.namespace }}, key: ${{ parameters.key }}, value: ${{ parameters.value }} }
    - id: apply
      action: adhar:kubernetes:apply
      input: { namespaced: true, manifestPath: secret.yaml, clusterName: local }
  output:
    text:
      - title: Created
        content: "Secret ${{ parameters.name }} created in ${{ parameters.namespace }}."
