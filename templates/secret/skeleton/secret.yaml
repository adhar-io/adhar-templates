apiVersion: platform.adhar.io/v1alpha1
kind: Secret
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
spec:
  crossplane:
    compositionRef:
      name: secret-local
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  type: generic
  stringData:
    ${{ values.key }}: ${{ values.value }}
