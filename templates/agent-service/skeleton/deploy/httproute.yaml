# Routed through the platform edge (adhar-gateway) at https://${{ values.hostname }}
# The agent's NetworkPolicy admits ingress from the platform namespace, which is
# where the gateway's data path runs, so this works with no further opening.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}-dev
  labels:
    app: ${{ values.name }}
    adhar.io/agent: ${{ values.name }}
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  # The platform route (<name>.<environment>.<domain>) plus any custom
  # hostnames given at scaffold time. A JSON list renders as a YAML sequence.
  hostnames: ${{ values.hostnamesJson }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${{ values.name }}
          port: 80
