apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agent-service
  title: AI Agent Service
  description: >-
    A production-shaped AI agent: a Python service that reasons with the
    platform's LLMs and calls platform tools through the AI gateway, deployed
    inside its own isolated AgentWorkload — dedicated namespace, default-deny
    network, a gateway identity that may name only the models and tools you list
    here, a declared token budget that is alerted on, and OpenTelemetry traces
    for every model call and tool call. Ships through the secure supply chain
    and promotes dev → test → prod like any other application.
  tags:
    - recommended
    - ai
    - agent
    - python
    - supply-chain
    - observability
spec:
  owner: group:platform-engineers
  type: service

  parameters:
    - title: Agent
      required: [name]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the agent (lowercase, DNS-friendly)
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this agent do, and for whom?
        owner:
          title: Owner
          type: string
          description: Team that owns this agent — accountable for what it does and spends
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        organisation: { title: Organisation, type: string, default: adhar }
        team: { title: Team, type: string, default: platform, description: 'Attribution: the agent carries adhar.io/team like every other workload' }
        project: { title: Project, type: string, default: adhar, description: 'The Project this agent belongs to (attribution and policy scope; the agent keeps its own isolated namespace)' }

        customHostnames:
          title: Custom hostnames
          type: string
          description: >-
            Optional, comma-separated. The app always answers on its platform
            route <name>.<environment>.<platform domain>; list any extra
            hostnames to serve on as well (each needs a Gateway listener and
            certificate that covers it).
    - title: Capabilities
      properties:
        models:
          title: Models the agent may call
          type: string
          default: "claude-.*,local/.*"
          description: >-
            Comma-separated model names or regexes. The gateway routes by model
            name and the agent never sees a provider or a key; this is the whole
            of what its identity may ask for. `claude-.*` is Anthropic, `gpt-.*`
            is OpenAI, `local/.*` is the in-cluster vLLM (free).
        tools:
          title: Tool domains the agent may call
          type: string
          default: "cluster,observability"
          description: >-
            Comma-separated federated MCP targets: cluster, observability, cost
            (read-only); gitops, provision, security, catalog (these open Gitea
            PRs). An agent gets no tools it does not list.
        tokensPerHour:
          title: Token budget per hour
          type: integer
          default: 100000
          description: Alert fires when the agent exceeds this in an hour.
        systemPrompt:
          title: System prompt
          type: string
          default: "You are a careful platform assistant. Prefer reading over acting; explain what you are about to do before calling a tool."

    - title: Runtime
      properties:
        port:
          title: Container port
          type: integer
          default: 8080
        replicas:
          title: Replicas
          type: integer
          default: 1
          minimum: 1
          maximum: 3

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Gitea repository to create for this agent
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - adhar.localtest.me:8443

    - title: Operations
      description: What on-call and the service scorecard need to know. Everything here lands in catalog-info.yaml and the deploy manifests, so the service starts with a score instead of earning one later.
      properties:
        lifecycle:
          title: Lifecycle
          type: string
          description: experimental while it is being built, production once it is GA, deprecated when it is being retired.
          enum: [experimental, production, deprecated]
          default: experimental
        tier:
          title: Tier
          type: string
          description: How much the business depends on it; sets alert severity.
          enum: [critical, high, standard, low]
          default: standard
        docsUrl:
          title: Documentation URL
          type: string
          description: Leave empty to point at the repository's docs/ folder.
          default: ""
        runbookUrl:
          title: Runbook URL
          type: string
          description: What to do when it pages. Linked from the catalog and the scorecard.
          default: ""
        oncall:
          title: On-call
          type: string
          description: Team or channel paged for this service, e.g. "#team-payments-oncall".
          default: ""
        sloTarget:
          title: Availability SLO (%)
          type: string
          description: The availability objective the alerts are tuned against.
          default: "99.9"
        latencyTargetMs:
          title: Latency target, p95 (ms)
          type: string
          description: The automated load test and the live SLO check fail the service above this.
          default: "500"
        perfPath:
          title: Load-test path
          type: string
          description: The endpoint the platform load-tests, e.g. "/api/items". Empty uses the readiness probe path.
          default: ""
        chaosTesting:
          title: Automated chaos testing
          type: boolean
          description: The platform kills a pod in test daily under a steady-state probe and scores whether the service kept answering. Never runs in prod.
          default: true
        chaosExperiments:
          title: Chaos scenarios
          type: string
          description: Litmus faults the platform runs against this service in test, in order, each its own scorecard signal. Any fault in the catalogue, comma-separated.
          default: "pod-delete,pod-network-latency,pod-cpu-hog"
        enableAlerts:
          title: Alert on restarts, unavailable pods and 5xx
          type: boolean
          description: Ships a PrometheusRule with the service (adhar.io/alerts).
          default: true
        enablePdb:
          title: PodDisruptionBudget
          type: boolean
          description: Keeps at least one replica through node drains and upgrades.
          default: true
        enableHpa:
          title: Autoscale on CPU
          type: boolean
          description: A HorizontalPodAutoscaler on the Rollout, 70% CPU, up to the maximum below.
          default: false
        maxReplicas:
          title: Maximum replicas when autoscaling
          type: integer
          default: 3
  steps:
    - id: template
      name: Generate the agent
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          organisation: ${{ parameters.organisation }}
          team: ${{ parameters.team }}
          project: ${{ parameters.project }}
          models: ${{ parameters.models }}
          tools: ${{ parameters.tools }}
          tokensPerHour: ${{ parameters.tokensPerHour }}
          systemPrompt: ${{ parameters.systemPrompt }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          # Operations. Without these the form's answers never reached the skeleton:
          # no service shipped its PDB, HPA or alerts and every SLO read the default.
          lifecycle: ${{ parameters.lifecycle }}
          tier: ${{ parameters.tier }}
          docsUrl: ${{ parameters.docsUrl }}
          runbookUrl: ${{ parameters.runbookUrl }}
          oncall: ${{ parameters.oncall }}
          sloTarget: ${{ parameters.sloTarget }}
          enableAlerts: ${{ parameters.enableAlerts }}
          enablePdb: ${{ parameters.enablePdb }}
          enableHpa: ${{ parameters.enableHpa }}
          maxReplicas: ${{ parameters.maxReplicas }}
          latencyTargetMs: ${{ parameters.latencyTargetMs }}
          perfPath: ${{ parameters.perfPath }}
          chaosTesting: ${{ parameters.chaosTesting }}
          chaosExperiments: ${{ parameters.chaosExperiments }}
          # LOCAL-DEVELOPMENT FALLBACK ONLY. The scaffolder overrides this with
          # the platform's real base domain before rendering (the Console in
          # apps/console/app/server/scaffolder.ts, the CLI in cmd/apps/scaffold.go),
          # because a template cannot know which domain the cluster serves. Left
          # as a literal it produced an HTTPRoute for a hostname the Gateway does
          # not answer on. Do not "fix" this by hardcoding another domain.
          hostname: ${{ parameters.name }}.adhar.localtest.me
          # Every hostname the HTTPRoute serves, as a JSON list (the renderer
          # substitutes strings, and a JSON list is a valid YAML flow sequence).
          # The scaffolder rewrites this to [<name>.<environment>.<domain>] plus
          # parameters.customHostnames; this literal is the local fallback.
          hostnamesJson: '["${{ parameters.name }}.dev.adhar.localtest.me"]'
          # One list per environment (dev/test/prod overlays patch the HTTPRoute
          # with these); the scaffolder sets them to <name>.<env>.<domain> and
          # appends parameters.customHostnames to prod.
          devHostnamesJson: '["${{ parameters.name }}.dev.adhar.localtest.me"]'
          testHostnamesJson: '["${{ parameters.name }}.test.adhar.localtest.me"]'
          prodHostnamesJson: '["${{ parameters.name }}.prod.adhar.localtest.me"]'
          platformBaseDomain: adhar.localtest.me
          gitOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          giteaHost: ${{ (parameters.repoUrl | parseRepoUrl).host }}

    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD deployment
      action: adhar:create-argocd-app
      input:
        appName: ${{ parameters.name }}
        appNamespace: adhar-system
        argoInstance: local
        projectName: default
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: "deploy"

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
