apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: object-bucket
  title: Object Storage Bucket
  description: >-
    Self-service S3-compatible object storage bucket, provisioned through the
    Adhar control plane (Crossplane) as a CompositeStorage (type: object). On the
    local platform it creates a bucket in the in-cluster MinIO; a connection
    Secret `<name>-bucket` (endpoint, bucket, region) is created.
  tags:
    - recommended
    - storage
    - bucket
    - s3
    - minio
    - self-service
    - crossplane
spec:
  owner: group:platform-engineers
  type: resource

  parameters:
    - title: Bucket
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        namespace:
          title: Namespace
          type: string
          default: adhar-system

  steps:
    - id: render
      name: Render the bucket claim
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}

    - id: apply
      name: Provision via Crossplane
      action: adhar:kubernetes:apply
      input:
        namespaced: true
        manifestPath: bucket.yaml
        clusterName: local

  output:
    text:
      - title: Provisioning
        content: |
          Bucket **${{ parameters.name }}** is being created in MinIO. Connection
          details are in Secret `${{ parameters.name }}-bucket` (endpoint, bucket)
          in namespace `${{ parameters.namespace }}`.
