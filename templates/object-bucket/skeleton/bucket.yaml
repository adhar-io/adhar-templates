# Object storage bucket claim — the control plane creates a MinIO bucket + a
# connection Secret from this.
apiVersion: platform.adhar.io/v1alpha1
kind: Storage
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    platform.adhar.io/self-service: "true"
spec:
  crossplane:
    compositionRef:
      name: storage-local-minio
  name: ${{ values.name }}
  type: object
  size: 1Gi
