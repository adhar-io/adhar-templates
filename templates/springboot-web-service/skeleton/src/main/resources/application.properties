spring.application.name=${{ values.name }}
server.port=${PORT:8080}

# OpenTelemetry (Micrometer Tracing + OTLP). Endpoint comes from the Rollout's
# OTEL_EXPORTER_OTLP_ENDPOINT env; Alloy fans out to Tempo/Mimir/Loki.
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.adhar-system.svc.cluster.local:4318}/v1/metrics
management.otlp.metrics.export.step=10s
management.tracing.sampling.probability=1.0

# Actuator: expose health (with k8s liveness/readiness probes), info, metrics.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

{%- if values.withAuth %}

# Authentication (Adhar Kit security). Every endpoint requires a bearer JWT from
# the platform's Keycloak realm `adhar`, checked against the realm's signing
# keys, EXCEPT the landing page `/` and the actuator — so the service's route
# visibly answers in a browser while its APIs stay protected. (A browser at `/`
# used to get a bare 401, which reads as "the route is broken".)
#
# The default JWKS address is the platform's in-cluster Keycloak. Override it
# with ADHAR_JWT_JWK_SET_URI when running outside the cluster, e.g.
# https://keycloak.<platform-domain>/realms/adhar/protocol/openid-connect/certs.
adhar.security.jwt.jwk-set-uri=${ADHAR_JWT_JWK_SET_URI:http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/certs}
adhar.security.authorization.permit-all=/,/actuator/**
{%- else %}

# Authentication is off: every endpoint is public. To require a Keycloak JWT, set
# adhar.security.jwt.jwk-set-uri (see the docs) and remove this line.
adhar.security.authorization.permit-all=/**
{%- endif %}
{%- if values.withDatabase %}

# Database — wired from the CloudNativePG secret via the Rollout env. The
# fallbacks match compose.yaml, so `docker compose up -d` is all local dev needs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.jpa.hibernate.ddl-auto=update
{%- endif %}
{%- if values.withCache %}

# Valkey cache (Adhar Kit). SPRING_DATA_REDIS_URL comes from the control plane's
# `${{ values.name }}-cache-app` Secret via the Rollout env; adhar-kit-cache makes
# Valkey the store behind every @Cacheable, so all replicas share one cache.
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
adhar.cache.time-to-live=${{ values.cacheTtl }}
adhar.cache.redis.key-prefix=${{ values.name }}::
{%- endif %}
{%- if values.withKafka %}

# Kafka — SPRING_KAFKA_BOOTSTRAP_SERVERS points at the Strimzi bootstrap
# Service via the Rollout env. The consumer group is the service name, so
# replicas share partitions instead of each receiving every event.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${{ values.name }}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic=${{ values.kafkaTopic }}
{%- endif %}
