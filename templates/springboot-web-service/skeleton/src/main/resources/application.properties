spring.application.name=${{ values.name }}
server.port=${PORT:8080}

# Tracing: adhar-kit exports spans over OTLP/HTTP to the endpoint in the Rollout's
# OTEL_EXPORTER_OTLP_ENDPOINT (Alloy -> Tempo), samples every trace by default and
# reads OTEL_SERVICE_NAME / OTEL_RESOURCE_ATTRIBUTES / OTEL_TRACES_SAMPLER_ARG.
# Spring Boot's own management.otlp.* settings had no effect here: Boot's tracing
# modules are not on the classpath, the kit's SDK is the one exporting.

# Actuator: expose health (with k8s liveness/readiness probes), info, metrics.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Client errors answer as client errors. adhar-kit-commons 0.1.0's exception
# handler turns every exception it does not know into a 500 — including Spring
# MVC's own 404 (no such path), 405 (wrong method) and 400 (missing or unreadable
# body) — which also counts them against the 5xx alert. Spring's RFC 9457
# handler takes precedence over it and answers those with their real status and
# a problem-detail body; the kit still handles its own exception types. Caught
# by the API tests in src/test/resources/karate.
spring.mvc.problemdetails.enabled=true

{%- if values.withAuth %}

# Authentication (Adhar Kit security). Every endpoint requires a bearer JWT from
# the platform's Keycloak realm `adhar`, checked against the realm's signing
# keys, EXCEPT the landing page `/` and the actuator — so the service's route
# visibly answers in a browser while its APIs stay protected. (A browser at `/`
# used to get a bare 401, which reads as "the route is broken".)
#
# The default JWKS address is the platform's in-cluster Keycloak. Override it
# with ADHAR_JWT_JWK_SET_URI when running outside the cluster, e.g.
# https://keycloak.<platform-domain>/realms/adhar/protocol/openid-connect/certs.
adhar.security.jwt.jwk-set-uri=${ADHAR_JWT_JWK_SET_URI:http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/certs}
adhar.security.authorization.permit-all=/,/actuator/**
{%- else %}

# Authentication is off: every endpoint is public. To require a Keycloak JWT, set
# adhar.security.jwt.jwk-set-uri (see the docs) and remove this line.
adhar.security.authorization.permit-all=/**
{%- endif %}
{%- if values.withDatabase %}

# Database — wired from the CloudNativePG secret via the Rollout env. The
# fallbacks match compose.yaml, so `docker compose up -d` is all local dev needs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.jpa.hibernate.ddl-auto=update
{%- endif %}
{%- if values.inServiceBatch %}

# In-service batch jobs (Adhar Kit, design 0025 §5.20). The sample job lives in
# io.adhar.service.batch; Spring Batch's JobRepository and the Quartz job store
# are migrated by adhar-kit-batch into schema `batch` of the database above, so
# do not set spring.batch.jdbc.* or spring.quartz.jdbc.* here. Every replica
# shares one clustered schedule: a slot runs once across them, and a replica
# that dies mid-run is re-fired on another one, which resumes from its last
# commit. Jobs that are long, heavy, partitioned or run by operators belong in
# a platform BatchJob (a batch template) instead.
adhar.batch.scheduler.enabled=true
adhar.batch.scheduler.engine=quartz
# The zone of every trigger and calendar below, and of the JVM (TZ in
# deploy/base/rollout.yaml, -Duser.timezone in pom.xml): a `daily` trigger runs
# in the JVM's zone, and the kit refuses one whose zone differs. Change all of
# them together.
adhar.batch.scheduler.time-zone=UTC
# Below the pod's terminationGracePeriodSeconds: on a rollout the kit stops a
# run at its next chunk boundary within this time, and another replica resumes it.
adhar.batch.shutdown.timeout=20s

# A business calendar (design 0025 D5): Saturdays and Sundays are not business
# days, nor are the listed holidays (ISO dates, comma-separated); a date in
# business-days is one even on a weekend. A trigger on it never fires on an
# excluded day. To share one with the platform's batch jobs, mount its
# calendar.yaml and set adhar.batch.quartz.calendars.weekdays.file instead.
adhar.batch.quartz.calendars.weekdays.time-zone=UTC
adhar.batch.quartz.calendars.weekdays.weekend-days=SATURDAY,SUNDAY
#adhar.batch.quartz.calendars.weekdays.holidays=2026-12-25,2027-01-01

# The sample job's triggers. Each one names the job's `cycle`, which is part of
# a run's identity with the business date: a cycle runs once per business day.
# A later fire of a COMPLETED identity is skipped, and a FAILED one is restarted
# from its last commit, so `intraday` keeps trying every 15 minutes during
# business hours until the day's settlement succeeds.
#   close    - a Quartz cron (seconds first), 18:00 on business days
#   intraday - every 15 minutes from 09:00 to 17:00 on business days
adhar.batch.quartz.triggers.settlementJob[0].name=close
adhar.batch.quartz.triggers.settlementJob[0].kind=cron
adhar.batch.quartz.triggers.settlementJob[0].expression=0 0 18 ? * *
adhar.batch.quartz.triggers.settlementJob[0].calendar=weekdays
adhar.batch.quartz.triggers.settlementJob[0].parameters.cycle=close
adhar.batch.quartz.triggers.settlementJob[1].name=intraday
adhar.batch.quartz.triggers.settlementJob[1].kind=daily
adhar.batch.quartz.triggers.settlementJob[1].from=09:00
adhar.batch.quartz.triggers.settlementJob[1].to=17:00
adhar.batch.quartz.triggers.settlementJob[1].every=15m
adhar.batch.quartz.triggers.settlementJob[1].calendar=weekdays
adhar.batch.quartz.triggers.settlementJob[1].parameters.cycle=intraday
{%- endif %}
{%- if values.withCache %}

# Valkey cache (Adhar Kit). SPRING_DATA_REDIS_URL comes from the control plane's
# `${{ values.name }}-cache-app` Secret via the Rollout env; adhar-kit-cache makes
# Valkey the store behind every @Cacheable, so all replicas share one cache.
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
adhar.cache.time-to-live=${{ values.cacheTtl }}
adhar.cache.redis.key-prefix=${{ values.name }}::
{%- endif %}
{%- if values.withKafka %}

# Kafka — SPRING_KAFKA_BOOTSTRAP_SERVERS points at the Strimzi bootstrap
# Service via the Rollout env. The consumer group is the service name, so
# replicas share partitions instead of each receiving every event.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${{ values.name }}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic=${{ values.kafkaTopic }}
{%- endif %}

# Request-latency histogram buckets, so the catalog Metrics tab and the
# per-application Grafana dashboard can draw p50/p95 (Micrometer emits only
# count/sum by default).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
