{%- if values.withCache %}
# Valkey (Redis-compatible) cache, provisioned by the Adhar control plane
# (Crossplane) — the same claim the `redis-cache` self-service template makes.
# The composition creates the Valkey Deployment + Service and a connection
# Secret `${{ values.name }}-cache-app` (uri, host, port); rollout.yaml injects
# its `uri` as SPRING_DATA_REDIS_URL.
#
# The pod waits in CreateContainerConfigError until that Secret exists, which is
# the intended order on first sync: the app never starts against a cache that is
# not there yet.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: ${{ values.name }}-cache
  labels:
    app: ${{ values.name }}
    app.kubernetes.io/name: ${{ values.name }}-cache
    platform.adhar.io/self-service: "true"
spec:
  crossplane:
    compositionRef:
      name: database-local-redis
  parameters:
    engine: redis
    engineVersion: "8"
    storageSize: 1Gi
{%- endif %}
