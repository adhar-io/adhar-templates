apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ (values.description or 'A function on the Adhar platform.') | dump }}
  annotations:
    adhar.io/owner: ${{ values.owner or 'group:platform-engineers' }}
    adhar.io/description: ${{ (values.description or '') | dump }}
    adhar.io/lifecycle: ${{ values.lifecycle or 'experimental' }}
    adhar.io/tier: ${{ values.tier or 'standard' }}
    adhar.io/workload: function
    adhar.io/runtime: node24
    adhar.io/dashboard: https://grafana.${{ values.platformBaseDomain or 'adhar.localtest.me' }}/d/app-${{ values.name }}
    adhar.io/slo: "${{ values.sloTarget or '99.9' }}"
{%- if values.runbookUrl %}
    adhar.io/runbook: ${{ values.runbookUrl }}
{%- endif %}
{%- if values.docsUrl %}
    adhar.io/docs: ${{ values.docsUrl }}
{%- endif %}
{%- if values.oncall %}
    adhar.io/oncall: ${{ values.oncall | dump }}
{%- endif %}
    argocd/app-name: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
    # TechDocs. `dir:.` is the Backstage standard and is what a TechDocs builder
    # consumes; the `Documentation` link below works with no builder installed,
    # because Gitea renders docs/*.md as readable Markdown from the first commit.
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Function (dev)
      url: https://${{ values.hostname }}
      icon: web
    - title: Dashboard
      url: https://grafana.${{ values.platformBaseDomain or 'adhar.localtest.me' }}/d/app-${{ values.name }}
      icon: dashboard
{%- if values.runbookUrl %}
    - title: Runbook
      url: ${{ values.runbookUrl }}
      icon: runbook
{%- endif %}
    - title: Documentation
      url: https://${{ values.giteaHost }}/${{ values.gitOwner }}/${{ values.repoName }}/src/branch/main/docs
      icon: docs
  tags:
    - function
    - deno
    - adhar
spec:
  type: function
  lifecycle: ${{ values.lifecycle or 'experimental' }}
  owner: ${{ values.owner or 'group:platform-engineers' }}
  providesApis:
    - ${{ values.name }}-api
---
# The function's HTTP interface, for the catalog's APIs. api/openapi.yaml is
# the contract: keep it in step with the handler.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.name }}-api
  description: HTTP interface of the ${{ values.name }} function.
  tags:
    - function
spec:
  type: openapi
  lifecycle: ${{ values.lifecycle or 'experimental' }}
  owner: ${{ values.owner or 'group:platform-engineers' }}
  definition:
    $text: ./api/openapi.yaml
