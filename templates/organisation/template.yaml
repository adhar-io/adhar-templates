apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: organisation
  title: Organisation
  description: >-
    Top of the Adhar ownership hierarchy. Registers an Organisation (Backstage
    Group). Teams belong to an Organisation; Teams own Projects; Projects hold
    Applications. The Gitea organisation is auto-created when the first Project
    is provisioned.
  tags: [organisation, hierarchy, ownership]
spec:
  owner: group:platform-engineers
  type: organisation
  parameters:
    - title: Organisation
      required: [orgId, repoUrl]
      properties:
        orgId:
          title: Organisation ID
          type: string
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        displayName: { title: Display name, type: string }
        description: { title: Description, type: string, default: "" }
        repoUrl:
          title: Catalog repository
          type: string
          description: Gitea repo to hold this organisation's catalog entry
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [adhar.localtest.me:8443]
  steps:
    - id: render
      action: fetch:template
      input:
        url: ./skeleton
        values:
          orgId: ${{ parameters.orgId }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
    # The organisation as a control-plane object (ADR-0026): its home namespace,
    # quota, group RBAC and Gitea organisation are composed from this one XR.
    - id: apply
      action: adhar:kubernetes:apply
      input:
        namespaced: true
        manifestPath: organisation.yaml
        clusterName: local
    - id: publish
      action: publish:gitea
      input:
        description: "Adhar organisation ${{ parameters.orgId }}"
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
    - id: register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Organisation in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
