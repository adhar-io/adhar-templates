apiVersion: platform.adhar.io/v1alpha1
kind: Project
metadata:
  name: ${{ values.name }}
  namespace: adhar-system
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
        feature: project
  parameters:
    organisation: ${{ values.organisation }}
    team: ${{ values.team }}
    name: ${{ values.name }}
    description: ${{ values.description }}
    tier: ${{ values.tier }}
    cpuQuota: "${{ values.cpuQuota }}"
    memoryQuota: ${{ values.memoryQuota }}
    podQuota: ${{ values.podQuota }}
    createRepository: ${{ values.createRepository }}
