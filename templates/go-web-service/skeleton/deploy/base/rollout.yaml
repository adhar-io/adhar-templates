# Progressive delivery with Argo Rollouts (canary). The image is the SIGNED
# Harbor image; the kyverno verify-supply-chain-images policy admits it only if
# cosign-signed, and mutates :latest to the verified digest — so what runs is
# exactly what was scanned + signed.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}
spec:
  replicas: ${{ values.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${{ values.name }}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  template:
    metadata:
      labels:
        app: ${{ values.name }}
    spec:
      # Replicas on different nodes, so one node failing cannot take the
      # service down (scorecard: spread_across_nodes).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ${{ values.name }}
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: harbor-dockercfg
      containers:
        - name: app
          image: harbor-core.adhar-system.svc.cluster.local/library/${{ values.name }}:latest
          # Leave the Service's endpoints before the process stops, so
          # in-flight requests finish during a rollout or a node drain
          # (scorecard: graceful_shutdown). The kubelet's own sleep action:
          # it needs no shell in the image.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - containerPort: ${{ values.port }}
          env:
            - name: PORT
              value: "${{ values.port }}"
            # OpenTelemetry — traces/metrics/logs over OTLP to the Alloy collector,
            # which fans out to Tempo/Mimir/Loki. Auto-instrumentation reads these.
            - name: OTEL_SERVICE_NAME
              value: "${{ values.name }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.adhar-system.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=adhar,deployment.environment=local"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
{%- if values.withDatabase %}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-db-app
                  key: uri
{%- endif %}
          readinessProbe:
            httpGet:
              path: /healthz
              port: ${{ values.port }}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: ${{ values.port }}
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
