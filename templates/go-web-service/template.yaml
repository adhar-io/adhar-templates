apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-web-service
  title: Go Web Service
  description: >-
    A production-shaped Go (net/http) web service wired into Adhar's secure
    supply chain — buildpacks build + cosign signing, kyverno signature
    verification, GitOps deploy via ArgoCD, and an optional managed PostgreSQL
    database. Source + GitOps config land in your own Gitea repo to customise.
  tags:
    - recommended
    - go
    - web
    - supply-chain
    - observability
spec:
  owner: group:platform-engineers
  type: service

  parameters:
    - title: Application
      required: [name]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the service (lowercase, DNS-friendly)
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this service do?
        owner:
          title: Owner
          type: string
          description: Team that owns this service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

        customHostnames:
          title: Custom hostnames
          type: string
          description: >-
            Optional, comma-separated. The app always answers on its platform
            route <name>.<environment>.<platform domain>; list any extra
            hostnames to serve on as well (each needs a Gateway listener and
            certificate that covers it).
    - title: Runtime
      properties:
        port:
          title: Container port
          type: integer
          default: 3000
        replicas:
          title: Replicas
          type: integer
          default: 1
          minimum: 1
          maximum: 5
        withDatabase:
          title: Provision a PostgreSQL database
          type: boolean
          default: false
          description: >-
            Creates a managed CloudNativePG Postgres cluster and injects its
            connection string into the app as DATABASE_URL.

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Gitea repository to create for this service
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - adhar.localtest.me:8443

    - title: Operations
      description: What on-call and the service scorecard need to know. Everything here lands in catalog-info.yaml and the deploy manifests, so the service starts with a score instead of earning one later.
      properties:
        lifecycle:
          title: Lifecycle
          type: string
          description: experimental while it is being built, production once it is GA, deprecated when it is being retired.
          enum: [experimental, production, deprecated]
          default: experimental
        tier:
          title: Tier
          type: string
          description: How much the business depends on it; sets alert severity.
          enum: [critical, high, standard, low]
          default: standard
        docsUrl:
          title: Documentation URL
          type: string
          description: Leave empty to point at the repository's docs/ folder.
          default: ""
        runbookUrl:
          title: Runbook URL
          type: string
          description: What to do when it pages. Linked from the catalog and the scorecard.
          default: ""
        oncall:
          title: On-call
          type: string
          description: Team or channel paged for this service, e.g. "#team-payments-oncall".
          default: ""
        sloTarget:
          title: Availability SLO (%)
          type: string
          description: The availability objective the alerts are tuned against.
          default: "99.9"
        latencyTargetMs:
          title: Latency target, p95 (ms)
          type: string
          description: The automated load test and the live SLO check fail the service above this.
          default: "500"
        perfPath:
          title: Load-test path
          type: string
          description: The endpoint the platform load-tests, e.g. "/api/items". Empty uses the readiness probe path.
          default: ""
        chaosTesting:
          title: Automated chaos testing
          type: boolean
          description: The platform kills a pod in test daily under a steady-state probe and scores whether the service kept answering. Never runs in prod.
          default: true
        chaosExperiments:
          title: Chaos scenarios
          type: string
          description: The faults this service's resilience suite runs, in order, under a continuous health probe — after every promotion into test (a failure blocks prod) and hourly for the scorecard. Chosen for this kind of service; the suite (deploy/base/resilience.yaml) describes each one and can be edited later.
          default: "pod-delete,pod-network-latency,pod-cpu-hog"
        enableAlerts:
          title: Alert on restarts, unavailable pods and 5xx
          type: boolean
          description: Ships a PrometheusRule with the service (adhar.io/alerts).
          default: true
        enablePdb:
          title: PodDisruptionBudget
          type: boolean
          description: Keeps at least one replica through node drains and upgrades.
          default: true
        enableHpa:
          title: Autoscale on CPU
          type: boolean
          description: A HorizontalPodAutoscaler on the Rollout, 70% CPU, up to the maximum below.
          default: false
        maxReplicas:
          title: Maximum replicas when autoscaling
          type: integer
          default: 3
  steps:
    # Fail fast with a friendly message if the supply chain isn't installed.
    - id: template
      name: Generate the service
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          # Operations. Without these the form's answers never reached the skeleton:
          # no service shipped its PDB, HPA or alerts and every SLO read the default.
          lifecycle: ${{ parameters.lifecycle }}
          tier: ${{ parameters.tier }}
          docsUrl: ${{ parameters.docsUrl }}
          runbookUrl: ${{ parameters.runbookUrl }}
          oncall: ${{ parameters.oncall }}
          sloTarget: ${{ parameters.sloTarget }}
          enableAlerts: ${{ parameters.enableAlerts }}
          enablePdb: ${{ parameters.enablePdb }}
          enableHpa: ${{ parameters.enableHpa }}
          maxReplicas: ${{ parameters.maxReplicas }}
          latencyTargetMs: ${{ parameters.latencyTargetMs }}
          perfPath: ${{ parameters.perfPath }}
          chaosTesting: ${{ parameters.chaosTesting }}
          chaosExperiments: ${{ parameters.chaosExperiments }}
          withDatabase: ${{ parameters.withDatabase }}
          # LOCAL-DEVELOPMENT FALLBACK ONLY. The scaffolder overrides this with
          # the platform's real base domain before rendering (the Console in
          # apps/console/app/server/scaffolder.ts, the CLI in cmd/apps/scaffold.go),
          # because a template cannot know which domain the cluster serves. Left
          # as a literal it produced an HTTPRoute for a hostname the Gateway does
          # not answer on, so a freshly created service had a URL that never
          # resolved. Do not "fix" this by hardcoding another domain.
          hostname: ${{ parameters.name }}.adhar.localtest.me
          # Every hostname the HTTPRoute serves, as a JSON list (the renderer
          # substitutes strings, and a JSON list is a valid YAML flow sequence).
          # The scaffolder rewrites this to [<name>.<environment>.<domain>] plus
          # parameters.customHostnames; this literal is the local fallback.
          hostnamesJson: '["${{ parameters.name }}.dev.adhar.localtest.me"]'
          # One list per environment (dev/test/prod overlays patch the HTTPRoute
          # with these); the scaffolder sets them to <name>.<env>.<domain> and
          # appends parameters.customHostnames to prod.
          devHostnamesJson: '["${{ parameters.name }}.dev.adhar.localtest.me"]'
          testHostnamesJson: '["${{ parameters.name }}.test.adhar.localtest.me"]'
          prodHostnamesJson: '["${{ parameters.name }}.prod.adhar.localtest.me"]'
          # Parsed from the RepoUrlPicker so the in-cluster build can clone the
          # app's own Gitea repo.
          gitOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

          # The host the repo was created on, so catalog-info.yaml's docs link
          # points at the real Gitea rather than a hardcoded domain.
          giteaHost: ${{ (parameters.repoUrl | parseRepoUrl).host }}
    - id: publish
      name: Publish to Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: create-argocd-app
      name: Create ArgoCD deployment
      action: adhar:create-argocd-app
      input:
        appName: ${{ parameters.name }}
        appNamespace: adhar-system
        argoInstance: local
        projectName: default
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        path: "deploy"

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
